<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>✍🏻 2027 IMGO TF</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c8f060">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="2027 IMGO">
<link rel="apple-touch-icon" href="icons/icon_192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a1a1a;--bg2:#222222;--bg3:#2a2a2a;--bg4:#323232;--bg5:#3a3a3a;
  --border:rgba(255,255,255,0.10);--border2:rgba(255,255,255,0.18);--border3:rgba(255,255,255,0.28);
  --text:#f0f0f0;--text2:#c0c0c0;--text3:#888;--text4:#555;
  --accent:#c8f060;--accent2:rgba(200,240,96,0.15);--accent3:rgba(200,240,96,0.08);
  --red:#ff5f5f;--amber:#ffb347;--blue:#6eb5ff;--purple:#b8a5ff;--teal:#5ecfb0;--pink:#ff8fa3;
  --r:10px;--rs:6px;
}
body.light{
  --bg:#f7f7f2;--bg2:#eeeee9;--bg3:#ffffff;--bg4:#f2f2ed;--bg5:#e8e8e3;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.14);--border3:rgba(0,0,0,0.22);
  --text:#1a1a1a;--text2:#444;--text3:#888;--text4:#bbb;
  --accent:#5a8a10;--accent2:rgba(90,138,16,0.1);--accent3:rgba(90,138,16,0.06);
  --red:#d93025;--amber:#c87800;--blue:#1a6fc4;--purple:#6b4fc4;--teal:#1a8a6a;--pink:#c4204a;
}
.theme-btn{font-size:16px;padding:4px 8px;border-radius:20px;border:1px solid var(--border2);background:none;color:var(--text3);transition:.15s;line-height:1;cursor:pointer}
.theme-btn:hover{border-color:var(--accent);color:var(--accent)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.6}
button{font-family:'Noto Sans KR',sans-serif;cursor:pointer}
input,select,textarea{font-family:'Noto Sans KR',sans-serif;font-size:14px;color:var(--text);background:var(--bg4);border:1px solid var(--border2);border-radius:var(--rs);padding:8px 10px;outline:none;transition:.15s;width:100%}

/* ── HEADER ── */
.hdr{border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;background:var(--bg);position:sticky;top:0;z-index:200}
.logo{font-weight:700;font-size:15px;color:var(--accent);letter-spacing:.04em}
.hdr-right{display:flex;align-items:center;gap:10px}
.dday{font-family:'JetBrains Mono',monospace;font-size:12px;background:var(--accent2);border:1px solid var(--accent);color:var(--accent);padding:3px 12px;border-radius:20px}

/* ── NAV ── */
.nav{display:flex;gap:0;padding:0 16px;border-bottom:1px solid var(--border);background:var(--bg);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.ntab{padding:12px 16px;font-size:13px;font-weight:500;color:var(--text3);background:none;border:none;border-bottom:2px solid transparent;transition:.15s;white-space:nowrap}
.ntab:hover{color:var(--text2)}
.ntab.on{color:var(--accent);border-bottom-color:var(--accent)}

/* ── MAIN ── */
.main{padding:20px 20px 80px;max-width:900px}
.page{display:none}.page.on{display:block}
.sec-title{font-size:11px;font-weight:700;letter-spacing:.12em;color:#fff;text-transform:uppercase;margin-bottom:14px}
body.light .sec-title{color:var(--text3)}

/* ── TERM TABS ── */
.term-tabs{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap}
.ttab{padding:6px 16px;font-size:12px;font-weight:500;border-radius:20px;border:1px solid var(--border2);color:var(--text3);background:none;transition:.15s}
.ttab:hover{border-color:var(--accent);color:var(--accent)}
.ttab.on{background:var(--accent2);border-color:var(--accent);color:var(--accent)}

/* ── STATS ── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:22px}
.sc{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.sc-label{font-size:11px;color:var(--text3);margin-bottom:5px}
.sc-val{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:500}
.sc-sub{font-size:11px;color:var(--text3);margin-top:2px}

/* ── CALENDAR ── */
.cal-wrap{margin-bottom:26px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-hd{text-align:center;font-size:11px;color:var(--text2);padding:6px 2px;font-weight:500}
.cc{background:var(--bg4);border:1px solid var(--border2);border-radius:var(--rs);padding:6px 5px;min-height:64px;height:auto}
.cc.today{border-color:var(--accent);background:var(--accent3)}
.cc.sday{border-color:rgba(94,207,176,.3)}
.cc.empty{background:transparent;border-color:transparent}
.cd{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text2);margin-bottom:3px}
body.light .cal-hd{color:var(--text3)}
body.light .cc{background:var(--bg3);border-color:var(--border)}
body.light .cd{color:var(--text3)}
.cc.today .cd{color:var(--accent);font-weight:500}
.cc-sub{font-size:9px;color:var(--teal);line-height:1.35;word-break:keep-all;overflow-wrap:break-word}
.cc-time{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--text3);margin-top:1px}

/* ── SCHEDULE ── */
.wdiv{font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace;letter-spacing:.05em;padding:8px 0 9px;border-top:1px solid var(--border);margin-bottom:6px}
.wdiv:first-child{border-top:none}
.sr{display:grid;grid-template-columns:auto 1fr auto;align-items:start;gap:10px;padding:9px 12px;border-radius:var(--rs);border:1px solid transparent;transition:.12s}
.sr:hover{background:var(--bg3);border-color:var(--border)}
.sr.today-row{background:var(--accent3);border-color:rgba(200,240,96,.15)}
.sr-date{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text2);white-space:nowrap}
.sr-day{font-size:10px;color:var(--text3)}
.sr-sub{font-size:13px;color:var(--text)}
.sr-note{font-size:11px;color:var(--text3)}
.sr-note-hi{font-size:11px;color:var(--amber)}
.sr-time{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--teal);white-space:nowrap;text-align:right}
.sr-time.pass{color:var(--text3)}
.sr-time.text{color:var(--amber);font-family:'Noto Sans KR',sans-serif}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:7px;vertical-align:middle;flex-shrink:0;margin-top:-1px}
.dot-mon{background:var(--accent)}.dot-wed{background:var(--blue)}.dot-fri{background:var(--purple)}.dot-sun{background:var(--amber)}.dot-sat{background:var(--red)}.dot-else{background:var(--teal)}

/* ── LECTURES ── */
.subj-tabs{display:flex;gap:5px;margin-bottom:18px;flex-wrap:wrap}
.stab{padding:5px 13px;font-size:12px;border-radius:20px;border:1px solid var(--border2);color:var(--text3);background:none;transition:.12s}
.stab:hover{border-color:var(--blue);color:var(--blue)}
.stab.on{background:rgba(110,181,255,.1);border-color:var(--blue);color:var(--blue)}
.apply-btn{padding:8px 18px;font-size:13px;font-weight:600;border-radius:20px;border:1px solid var(--accent);color:var(--bg);background:var(--accent);transition:.15s;cursor:pointer}
.apply-btn:hover{opacity:.85}
.apply-btn:active{transform:scale(.97)}
.apply-btn-sm{padding:5px 13px;font-size:12px;font-weight:600;border-radius:20px;border:1px solid var(--accent);color:var(--bg);background:var(--accent);transition:.15s;cursor:pointer}
.apply-btn-sm:hover{opacity:.85}
.apply-btn-sm:active{transform:scale(.97)}
.lec-list{display:grid;grid-template-columns:1fr;gap:5px}
@media(min-width:560px){.lec-list{grid-template-columns:repeat(2,1fr)}}
.li{display:flex;align-items:flex-start;gap:9px;padding:9px 11px;background:var(--bg4);border:1px solid var(--border2);border-radius:var(--rs);transition:.12s}
.li:hover{border-color:var(--border3);background:var(--bg5)}
.li.old{background:var(--bg3);border-color:var(--border)}
.li.old:hover{border-color:var(--border2)}
.li.old .lnum{color:var(--amber)}
body.light .li{background:var(--bg3);border-color:var(--border)}
body.light .li:hover{background:var(--bg4);border-color:var(--border2)}
body.light .li.old{background:var(--bg4);border-color:var(--border2)}
body.light .li.old:hover{background:var(--bg5);border-color:var(--border3)}
.lnum{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--teal);white-space:nowrap;padding-top:2px;min-width:34px}
.ltitle{font-size:12px;color:var(--text);line-height:1.5}
.old-badge{font-size:9px;background:rgba(255,179,71,.15);color:var(--amber);border:1px solid rgba(255,179,71,.3);padding:1px 6px;border-radius:10px;margin-left:6px;white-space:nowrap;vertical-align:middle}
.lec-old-toggle{display:flex;align-items:center;gap:9px;margin:-4px 0 16px;color:var(--text2);font-size:12px}
.toggle-wrap{position:relative;display:inline-block;width:42px;height:24px;flex:0 0 auto}
.toggle-wrap input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;inset:0;background:var(--bg4);border:1px solid var(--border2);border-radius:999px;transition:.18s}
.slider:before{content:"";position:absolute;width:18px;height:18px;left:2px;top:2px;background:var(--text3);border-radius:50%;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle-wrap input:checked + .slider{background:var(--amber2,rgba(255,179,71,.15));border-color:rgba(255,179,71,.45)}
.toggle-wrap input:checked + .slider:before{transform:translateX(18px);background:var(--amber)}

/* ── NOTICE ── */
.nc{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:14px}
.exam-score-table{width:100%;border-collapse:collapse;font-size:12px}
.exam-score-table th{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;padding:6px 6px;border-bottom:1px solid var(--border2);text-align:center;white-space:nowrap}
.exam-score-table td{padding:8px 6px;border-bottom:1px solid var(--border);text-align:center;white-space:nowrap;font-family:'JetBrains Mono',monospace}
.exam-score-table td.exam-score-name{font-family:'Noto Sans KR',sans-serif;text-align:left;color:var(--text)}
.exam-score-table tr:last-child td{border-bottom:none}
.nc-stitle{font-size:11px;color:#fff;text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px;font-weight:700}
body.light .nc-stitle{color:var(--text3)}
.nr{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.nr:last-child{border-bottom:none;padding-bottom:0}
.nl{color:var(--text2)}.nv{font-weight:500}.nv.a{color:var(--accent)}
.fine-row{display:flex;align-items:center;gap:10px;padding:9px 13px;background:var(--bg4);border-radius:var(--rs);margin-bottom:5px}
.fine-icon{width:26px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:13px}
.fine-name{font-size:13px;flex:1}.fine-amt{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500}
.link-card{display:flex;align-items:center;gap:12px;padding:13px 16px;background:var(--bg4);border:1px solid var(--border2);border-radius:var(--r);text-decoration:none;transition:.15s;margin-bottom:7px}
.link-card:hover{border-color:var(--accent)}
.link-title{font-size:13px;color:var(--text)}.link-url{font-size:11px;color:var(--text3);margin-top:1px;font-family:'JetBrains Mono',monospace}
.link-arr{color:var(--text3);margin-left:auto;font-size:16px}
.unable-list{display:flex;flex-direction:column;gap:5px}
.ui-item{display:flex;align-items:center;gap:9px;padding:8px 13px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);font-size:13px;color:var(--text2)}
.ucnt{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--amber);min-width:22px;text-align:center}


/* scrollbar */
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
@media(max-width:767px){body{zoom:0.75}}

/* ── EXAMS ── */
.exam-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;letter-spacing:.03em;white-space:nowrap}
.badge-complete{background:rgba(94,207,176,.15);color:var(--teal);border:1px solid rgba(94,207,176,.3)}
.badge-plan{background:rgba(200,240,96,.12);color:var(--accent);border:1px solid rgba(200,240,96,.25)}
.badge-unknown{background:rgba(136,136,136,.12);color:var(--text3);border:1px solid rgba(136,136,136,.2)}
.exam-cnt{font-family:'JetBrains Mono',monospace;font-size:11px;min-width:28px;text-align:right;padding-top:2px}
.exam-cnt.cnt-complete{color:var(--teal)}
.exam-cnt.cnt-plan{color:var(--accent)}
.exam-cnt.cnt-unknown{color:var(--text3)}
.exam-row{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);margin-bottom:5px;transition:.12s}
.exam-row:hover{border-color:var(--border2)}
.exam-cnt{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text3);min-width:28px;text-align:right;padding-top:2px}
.exam-name{font-size:13px;color:var(--text);flex:1;line-height:1.5}
.exam-essay{font-size:10px;color:var(--amber);background:rgba(255,179,71,.15);border:1px solid rgba(255,179,71,.3);padding:1px 6px;border-radius:8px;white-space:nowrap;margin-left:4px;vertical-align:middle}
</style>
</head>
<body>


<!-- HEADER -->
<div class="hdr">
  <div class="logo">✍🏻 2027 IMGO TF</div>
  <div class="hdr-right">
    <div class="dday" id="ddayBadge">D-?</div>
    <button class="theme-btn" id="themeToggleBtn" onclick="toggleTheme()" title="라이트/다크 전환">🌙</button>
  </div>
</div>

<!-- NAV -->
<nav class="nav">
  <button class="ntab on" onclick="goPage('schedule',this)">스터디 현황</button>
  <button class="ntab" onclick="goPage('studywrong',this)">스터디 오답</button>
  <button class="ntab" onclick="goPage('lectures',this)">강의 목록</button>
  <button class="ntab" onclick="goPage('exams',this)">모의고사</button>
  <button class="ntab" onclick="goPage('notice',this)">공지사항</button>
</nav>

<!-- ======= PAGE: SCHEDULE ======= -->
<div class="page on main" id="page-schedule">


    <div class="term-tabs" id="termTabs"></div>
  <div class="stats" id="statsRow"></div>
  <div class="cal-wrap"><div class="sec-title">2주 캘린더</div><div id="calGrid"></div></div>
  <div class="sec-title">전체 일정</div>
  <div id="scheduleList"></div>
</div>

<!-- ======= PAGE: STUDY WRONG ANSWERS ======= -->
<div class="page main" id="page-studywrong">
  <div class="ttab-wrap" id="swAuthorToggle" style="display:flex;gap:8px;margin-bottom:18px"></div>

  <div class="subj-tabs" id="swSubjectTabs" style="margin-bottom:12px;flex-wrap:wrap"></div>

  <div class="subj-tabs" id="swTermTabs" style="margin-bottom:16px"></div>

  <div id="swWrongList"></div>
</div>

<!-- ======= PAGE: LECTURES ======= -->
<div class="page main" id="page-lectures">
  <div class="sec-title">과목별 강의 목록</div>
  <div class="subj-tabs" id="subjectTabs"></div>
  <div class="lec-list" id="lectureList"></div>
</div>


<!-- ======= PAGE: EXAMS ======= -->
<div class="page main" id="page-exams">

  <div class="ttab-wrap" id="examPersonTabs" style="display:flex;gap:8px;margin-bottom:18px">
    <button class="ttab on" onclick="showExamPerson('status',this)">현황</button>
    <button class="ttab" onclick="showExamPerson('재언',this)">재언</button>
    <button class="ttab" onclick="showExamPerson('태현',this)">태현</button>
  </div>

  <div id="examPanel-status">
    <div class="sec-title" id="exam-updated-label" style="margin-bottom:18px"></div>

    <!-- 현황 범례 -->
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px">
      <span style="font-size:11px;color:var(--text3)">현황:</span>
      <span class="exam-badge badge-complete">완료</span>
      <span class="exam-badge badge-plan">예정</span>
      <span class="exam-badge badge-unknown">미정</span>
    </div>

    <div id="examList"></div>
  </div>

  <div id="examPanel-person" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">
      <div class="subj-tabs" id="examSectionTabs" style="margin:0"></div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <div class="subj-tabs" id="modeTabs" style="margin:0"></div>
        <button class="apply-btn-sm" onclick="openRecordModal()">+ 기록</button>
      </div>
    </div>

    <div id="examSec-record" class="nc" style="margin-bottom:16px">
      <div class="nc-stitle" style="margin-bottom:10px">모의고사 기록</div>
      <div style="overflow-x:auto" id="exam-record-table-wrap"></div>
    </div>

    <div id="examSec-trend" class="nc" style="margin-bottom:16px">
      <div class="nc-stitle" style="margin-bottom:10px">회차별 추이</div>
      <div class="subj-tabs" style="margin:0 0 10px">
        <div class="subj-tabs" id="seriesTabs" style="margin:0;gap:5px"></div>
        <div class="subj-tabs" id="avgTabs" style="margin:0;gap:5px"></div>
      </div>
      <div style="width:100%;position:relative;height:330px">
        <canvas id="examTrendChart"></canvas>
      </div>
      <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:10px">
        <span style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)"><span style="width:9px;height:9px;border-radius:50%;background:#b8a5ff;display:inline-block"></span>총점</span>
        <span style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)"><span style="width:9px;height:9px;border-radius:50%;background:#5b8dee;display:inline-block"></span>A형</span>
        <span style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)"><span style="width:9px;height:9px;border-radius:50%;background:#3ecf8e;display:inline-block"></span>B형</span>
        <span style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)"><span style="width:9px;height:9px;border-radius:50%;background:transparent;border:2px solid var(--text3);display:inline-block"></span>평균</span>
      </div>
    </div>

    <div id="examSec-subject" class="nc" style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;flex-wrap:wrap;gap:8px">
        <div class="nc-stitle" style="margin:0">과목별 추이</div>
        <button class="stab" id="subjToggleAllBtn" style="border-color:var(--accent);color:var(--accent)" onclick="toggleAllSubjects()"></button>
      </div>
      <div class="subj-tabs" id="examSubjectTabs" style="margin:10px 0"></div>
      <div style="width:100%;position:relative;height:270px">
        <canvas id="examSubjectChart"></canvas>
      </div>
    </div>

    <div id="examSec-avg" class="nc" style="margin-bottom:16px">
      <div class="nc-stitle" style="margin-bottom:10px">과목별 평균</div>
      <div style="width:100%;position:relative;height:220px">
        <canvas id="avgRateChart"></canvas>
      </div>
    </div>

    <div id="examSec-wrong" class="nc">
      <div class="nc-stitle" style="margin-bottom:10px">오답 기록</div>
      <div style="display:flex;gap:6px;margin-bottom:10px;align-items:center;flex-wrap:wrap">
        <select id="wrongQueryMode" onchange="onWrongQueryModeChange()" style="flex:0 0 72px;min-width:72px">
          <option value="exam">회차</option>
          <option value="subject">과목</option>
        </select>
        <div id="wrongExamRow" style="display:flex;gap:6px;flex:1;min-width:0">

// ==================== D-DAY ====================
function updateDday(){
  const parts = (S.dday||'2026-11-07').split('-');
  const dd = new Date(parseInt(parts[0]),parseInt(parts[1])-1,parseInt(parts[2]));
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.ceil((dd-today)/(864e5));
  const badge = document.getElementById('ddayBadge');
  badge.textContent = diff>0?'D-'+diff:diff===0?'D-DAY ★':'D+'+Math.abs(diff);
}

// ==================== STATS ====================
function isStudyTimeValue(v){
  return /^\d+:\d{1,2}$/.test(String(v||'').trim());
}
function studyTimeMins(v){
  if(!isStudyTimeValue(v)) return 0;
  const p=String(v).trim().split(':');
  return parseInt(p[0],10)*60+parseInt(p[1],10);
}
function buildStats(t){
  const td = S.schedule[t]||[];
  let total=0,done=0,totalMins=0;
  td.forEach(w=>w.items.forEach(it=>{
    if(it.date==='-')return; total++;
    if(isStudyTimeValue(it.time)){done++;totalMins+=studyTimeMins(it.time);}
  }));
  const h=Math.floor(totalMins/60),m=totalMins%60;
  const period = ((S.termPeriods&&S.termPeriods[t])||'미정').replace(' ~ ','<br>~ ');
  document.getElementById('statsRow').innerHTML=`
    <div class="sc"><div class="sc-label">기간</div><div class="sc-val" style="font-size:11px;padding-top:5px;color:var(--text2);line-height:1.4">${period}</div><div class="sc-sub">&nbsp;</div></div>
    <div class="sc"><div class="sc-label">전체 회차</div><div class="sc-val">${total}</div><div class="sc-sub">회</div></div>
    <div class="sc"><div class="sc-label">기록 완료</div><div class="sc-val" style="color:var(--accent)">${done}</div><div class="sc-sub">/ ${total}</div></div>
    <div class="sc"><div class="sc-label">총 스터디 시간</div><div class="sc-val">${h}<span style="font-size:13px;color:var(--text3)">h</span>${m}<span style="font-size:13px;color:var(--text3)">m</span></div><div class="sc-sub">기록 기준</div></div>`;
}

// ==================== CALENDAR ====================
const dotColors={월:'var(--accent)',수:'var(--blue)',금:'var(--purple)',일:'var(--amber)',토:'var(--red)',화:'var(--teal)',목:'var(--pink)'};
function buildCalendar(t){
  const today=new Date();today.setHours(0,0,0,0);
  const studyMap={};
  (S.schedule[t]||[]).forEach(w=>w.items.forEach(it=>{
    if(it.date==='-')return;
    const p=it.date.split('/');
    const yr= parseInt(p[0])>=6?2026:2027;
    const key=`${yr}-${parseInt(p[0])-1}-${parseInt(p[1])}`;
    studyMap[key]={subject:it.subject,time:it.time};
  }));
  const start=new Date(today);
  const dow=start.getDay();
  start.setDate(start.getDate()+(dow===0?-6:1-dow));
  const dayL=['월','화','수','목','금','토','일'];
  let html='<div class="cal-grid">';
  dayL.forEach(l=>html+=`<div class="cal-hd">${l}</div>`);
  for(let i=0;i<14;i++){
    const d=new Date(start);d.setDate(d.getDate()+i);
    const key=`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    const isT=d.getTime()===today.getTime();
    const info=studyMap[key];
    let cls='cc'+(isT?' today':info?' sday':'');
    html+=`<div class="${cls}"><div class="cd">${d.getMonth()+1}/${d.getDate()}</div>`;
    if(info){
      html+=`<div class="cc-sub">${info.subject}</div>`;
      if(info.time){
        const cls=isStudyTimeValue(info.time)?'cc-time':'cc-time sr-note-hi';
        html+=`<div class="${cls}">${info.time}</div>`;
      }
    }
    html+='</div>';
  }
  html+='</div>';
  document.getElementById('calGrid').innerHTML=html;
}

// ==================== SCHEDULE LIST ====================
function buildSchedule(t){
  const td=S.schedule[t]||[];
  const ddayParts=(S.dday||'2026-11-07').split('-');
  const ddayDate=new Date(parseInt(ddayParts[0]),parseInt(ddayParts[1])-1,parseInt(ddayParts[2]));
  const today=new Date();today.setHours(0,0,0,0);

  // Flatten all items with their date objects, sorted
  const allItems=[];
  td.forEach(w=>w.items.forEach(it=>{
    if(it.date==='-'){allItems.push({item:it,dateObj:null});return;}
    const p=it.date.split('/');
    const mo=parseInt(p[0]),da=parseInt(p[1]);
    const yr=(mo>=6&&mo<=12)?2026:2027;
    const dateObj=new Date(yr,mo-1,da);
    dateObj.setHours(0,0,0,0);
    allItems.push({item:it,dateObj});
  }));
  allItems.sort((a,b)=>{
    if(!a.dateObj) return 1;
    if(!b.dateObj) return -1;
    return a.dateObj-b.dateObj;
  });

  // Compute D-day for upcoming Monday
  function getDdayForMonday(mondayDate){
    mondayDate.setHours(0,0,0,0);
    const diff=Math.ceil((ddayDate-mondayDate)/(864e5));
    return diff>0?'D-'+diff:diff===0?'D-DAY':'D+'+ Math.abs(diff);
  }

  let html='';
  let lastWeekSunday=null; // tracks the Sunday of the current week

  // Helper: get Monday of the week containing a date (Mon=start)
  function getMondayOf(d){
    const day=d.getDay(); // 0=Sun
    const diff=day===0?-6:1-day;
    const mon=new Date(d);
    mon.setDate(d.getDate()+diff);
    mon.setHours(0,0,0,0);
    return mon;
  }

  for(const {item,dateObj} of allItems){
    if(!dateObj){
      html+=`<div class="sr"><div class="sr-sub" style="color:var(--text3);grid-column:1/-1">${item.subject}</div></div>`;
      continue;
    }
    const monday=getMondayOf(dateObj);
    const mondayKey=monday.getTime();

    if(lastWeekSunday===null||mondayKey>lastWeekSunday){
      // Insert week divider before this item
      const dday=getDdayForMonday(new Date(monday));
      const mondayLabel=`${monday.getMonth()+1}/${monday.getDate()}`;
      html+=`<div class="wdiv">— ${dday} <span style="color:var(--text4);font-size:10px">(${mondayLabel}~)</span></div>`;
      lastWeekSunday=mondayKey;
    }

    const dc=dotColors[item.day]||'var(--teal)';
    const isToday=dateObj.getTime()===today.getTime();
    const rowCls=isToday?' today-row':'';

    // parse subject and note from item
    // note is in item.note field (orange color)
    const hasNumericTime=isStudyTimeValue(item.time);
    const hasTextTime=item.time&&!hasNumericTime;
    const noteH=item.note?`<span class="sr-note-hi"> · ${item.note}</span>`:'';
    const timeH=hasNumericTime?`<div class="sr-time">[${item.time}]</div>`:
                hasTextTime?`<div class="sr-time text">${item.time}</div>`:
                `<div class="sr-time pass">—</div>`;

    html+=`<div class="sr${rowCls}"><div class="sr-date"><span class="dot" style="background:${dc}"></span>${item.date}<span class="sr-day">(${item.day})</span></div><div class="sr-sub">${item.subject}${noteH}</div>${timeH}</div>`;
  }
  document.getElementById('scheduleList').innerHTML=html||'<div style="color:var(--text3);padding:20px 0;font-size:13px">일정이 없습니다.</div>';
}

// ==================== TERM SWITCH ====================
function parseTermPeriod(str){
  // "2026.06.01 ~ 08.17" 형식 파싱
  if(!str) return null;
  const parts = str.split('~').map(s=>s.trim());
  if(parts.length!==2) return null;
  const startM = parts[0].match(/(\d{4})\.(\d{1,2})\.(\d{1,2})/);
  if(!startM) return null;
  const year = parseInt(startM[1]);
  const start = new Date(year, parseInt(startM[2])-1, parseInt(startM[3]));
  let end = null;
  const endFullM = parts[1].match(/(\d{4})\.(\d{1,2})\.(\d{1,2})/);
  const endShortM = parts[1].match(/(\d{1,2})\.(\d{1,2})/);
  if(endFullM){
    end = new Date(parseInt(endFullM[1]), parseInt(endFullM[2])-1, parseInt(endFullM[3]));
  } else if(endShortM){
    let endYear = year;
    if(parseInt(endShortM[1]) < parseInt(startM[2])) endYear = year+1; // 연도 넘어가는 경우
    end = new Date(endYear, parseInt(endShortM[1])-1, parseInt(endShortM[2]));
  }
  return { start, end };
}
function detectCurrentTerm(){
  const today = new Date(); today.setHours(0,0,0,0);
  const terms = [1,2,3]
    .map(t=>({ t, period: parseTermPeriod((S.termPeriods||{})[t]) }))
    .filter(x=>x.period);
  if(!terms.length) return 1;
  terms.sort((a,b)=>a.period.start-b.period.start);
  let result = terms[0].t; // 첫 텀 시작 전이면 1텀 기본 표시
  terms.forEach(({t, period})=>{
    if(today >= period.start) result = t; // 시작한 텀 중 가장 최근 텀
  });
  return result;
}

  buildStats(n);buildCalendar(n);buildSchedule(n);

}

// ---- exam name parsing: base 이름 + 회차 분리 ----
function parseExamEntry(raw){
  const name = raw.trim();
  let m = name.match(/^(.*?)(\d+)~(\d+)\?*회$/);
  if(m){ const rounds=[]; for(let i=+m[2];i<=+m[3];i++) rounds.push(i+'회'); return {base:m[1].trim(), rounds}; }
  m = name.match(/^(.*?)([\d,]+)월$/);
  if(m && m[2].includes(',')) return {base:m[1].trim(), rounds:m[2].split(',').map(n=>n.trim()+'월')};
  m = name.match(/^(.*?)([\d,]+)회$/);
  if(m && m[2].includes(',')) return {base:m[1].trim(), rounds:m[2].split(',').map(n=>n.trim()+'회')};
  // 회차가 하나뿐이어도(예: "임고온 1회") 이름과 회차를 분리
  m = name.match(/^(.+?)\s*(\d+회)$/);
  if(m && m[1].trim()) return {base:m[1].trim(), rounds:[m[2]]};
  m = name.match(/^(.+?)\s*(\d+월)$/);
  if(m && m[1].trim()) return {base:m[1].trim(), rounds:[m[2]]};
  return {base:name, rounds:['']};
}
function examTree(){
  const map = {};
  (S.exams||[]).forEach(e=>{
    if(e.status==='현황') return;
    const {base, rounds} = parseExamEntry(e.name);
    if(!map[base]) map[base]=new Set();
    rounds.forEach(r=>map[base].add(r));
  });
  return Object.keys(map).map(b=>({base:b, rounds:[...map[b]]}));
}
function fullExamName(base, round){ return round ? (base+' '+round) : base; }
function splitExamLabel(examName){
  const tree = examTree();
  for(const t of tree){
    if(examName===t.base) return { title:t.base, round:'' };
    if(examName.startsWith(t.base+' ')) return { title:t.base, round:examName.slice(t.base.length+1) };
  }
  return { title:examName, round:'' };
}

function renderExamRecordTable(){
  const wrap = document.getElementById('exam-record-table-wrap');
  if (!wrap) return;
  const rows = dedupeLatest(personScores(), r=>r.author+'|'+r.examName+'|'+r.type+'|'+r.subject);
  const subjType = {}; SUBJECT_META.forEach(s=>{ subjType[s.name]=s.type; });
  const byExam = {};
  rows.forEach(r=>{
    if(!byExam[r.examName]) byExam[r.examName] = { date:r.examDate, subj:{}, total:0, a:0, b:0 };
    byExam[r.examName].subj[r.subject] = Number(r.score);
    byExam[r.examName].total += Number(r.score)||0;
    if(subjType[r.subject]==='A') byExam[r.examName].a += Number(r.score)||0;
    else if(subjType[r.subject]==='B') byExam[r.examName].b += Number(r.score)||0;
  });
  const examNames = Object.keys(byExam).sort((a,b)=> new Date(byExam[a].date) - new Date(byExam[b].date));
  if (!examNames.length) {
    wrap.innerHTML = '<div style="color:var(--text3);font-size:13px;padding:16px 8px">기록된 모의고사가 없습니다. 우측 상단 + 기록 버튼으로 추가하세요.</div>';
    return;
  }
  // 회차별 A/B 응시자 평균 -> 총점 평균(A+B) 계산
  const avgByExam = {};
  (examData.averages||[]).forEach(a=>{
    if(!avgByExam[a.examName]) avgByExam[a.examName] = {A:null,B:null};
    avgByExam[a.examName][a.type] = Number(a.averageScore||0);
  });
  function avgOf(examName, key){
    const rec = avgByExam[examName];
    if(!rec) return null;
    if(key==='A') return rec.A;
    if(key==='B') return rec.B;
    if(rec.A===null && rec.B===null) return null;
    return (rec.A||0)+(rec.B||0);
  }
  function diffTag(val, avg){
    if(avg===null || avg===undefined) return '';
    const d = Math.round((val-avg)*10)/10;
    const c = d>=0 ? 'var(--blue)' : 'var(--red)';
    const sign = d>=0 ? '+' : '-';
    return `\u2009<span style="color:${c};font-size:10px">(${sign}${Math.abs(d)})</span>`;
  }
  const subjCols = SUBJECT_META;
  const divider = 'border-left:1px solid var(--border2)';
  const isRate = examMode==='rate';
  function rateOf(v, max){ return v===undefined||v===null ? undefined : Math.round(v/max*1000)/10; }
  function cellVal(v, max){
    if(v===undefined || v===null) return '-';
    return isRate ? rateOf(v,max).toFixed(1)+'%' : v;
  }
  let html = '<table class="exam-score-table"><thead><tr><th style="text-align:left">회차</th><th style="' + divider + '">날짜</th>';
  subjCols.forEach((s,i)=>{ html += `<th style="color:${s.color}${i===0?';'+divider:''}"><span style="display:block;line-height:1.2">${s.name}</span><span style="display:block;font-size:9px;font-weight:400;opacity:.7;line-height:1.2;margin-top:1px">${isRate?'정답률':s.max+'점'}</span></th>`; });
  html += `<th style="color:${SERIES_COLOR.A};${divider}"><span style="display:block;line-height:1.2">A형</span><span style="display:block;font-size:9px;font-weight:400;opacity:.7;line-height:1.2;margin-top:1px">${isRate?'정답률':'39점'}</span></th><th style="color:${SERIES_COLOR.B}"><span style="display:block;line-height:1.2">B형</span><span style="display:block;font-size:9px;font-weight:400;opacity:.7;line-height:1.2;margin-top:1px">${isRate?'정답률':'41점'}</span></th><th style="color:var(--purple)"><span style="display:block;line-height:1.2">총점</span><span style="display:block;font-size:9px;font-weight:400;opacity:.7;line-height:1.2;margin-top:1px">${isRate?'정답률':'80점'}</span></th></tr></thead><tbody>`;
  examNames.forEach(n=>{
    const e = byExam[n];
    html += `<tr><td class="exam-score-name">${n}</td><td style="${divider}">${mmdd(e.date)}</td>`;
    subjCols.forEach((s,i)=>{ html += `<td${i===0?` style="${divider}"`:''}>${cellVal(e.subj[s.name], s.max)}</td>`; });
    const aAvg = avgOf(n,'A'), bAvg = avgOf(n,'B'), tAvg = avgOf(n,'total');
    if(isRate){
      html += `<td style="${divider};color:var(--text)">${rateOf(e.a,39).toFixed(1)}%</td><td style="color:var(--text)">${rateOf(e.b,41).toFixed(1)}%</td>`;
      html += `<td style="color:var(--text)">${rateOf(e.total,80).toFixed(1)}%</td></tr>`;
    } else {
      html += `<td style="${divider};color:var(--text)">${e.a}${diffTag(e.a,aAvg)}</td><td style="color:var(--text)">${e.b}${diffTag(e.b,bAvg)}</td>`;
      html += `<td style="color:var(--text)">${e.total}${diffTag(e.total,tAvg)}</td></tr>`;
    }
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;
}

function personScores(){ return examData.scores.filter(r=>r.author===examPerson); }

function mmdd(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr);
  if(isNaN(d)) return dateStr;
  return (d.getMonth()+1)+'/'+d.getDate();
}
function multiLineLabel(examName, dateStr){
  const { title, round } = splitExamLabel(examName);
  const lines = [mmdd(dateStr)];
  title.split(' ').forEach(w=>lines.push(w));
  if(round) lines.push(round);
  return lines;
}
function fmtVal(v){
  if(v===null || v===undefined) return '';
  return examMode==='rate' ? (Math.round(v*10)/10).toFixed(1)+'%' : Math.round(v)+'점';
}
function fmtBoth(rawScore, max){
  if(rawScore===null || rawScore===undefined || !max) return '';
  const rate = Math.round(rawScore/max*1000)/10;
  return Math.round(rawScore)+'점 ('+rate.toFixed(1)+'%)';
}

// 점 위에 값 라벨을 직접 그려주는 경량 플러그인 (외부 CDN 의존 없이 처리)
const valueLabelPlugin = {
  id:'valueLabelPlugin',
  afterDatasetsDraw(chart){
    const ctx = chart.ctx;
    chart.data.datasets.forEach((ds,di)=>{
      if(ds.hideLabel) return;
      const meta = chart.getDatasetMeta(di);
      if(meta.hidden) return;
      meta.data.forEach((point,i)=>{
        const v = ds.data[i];
        if(v===null || v===undefined) return;
        ctx.save();
        ctx.font = '10px sans-serif';
        ctx.fillStyle = ds.isAvgDataset ? examThemeTextColor() : (ds.borderColor || '#888');
        ctx.textAlign = 'center';
        ctx.fillText(fmtVal(v), point.x, point.y - 8);
        ctx.restore();
      });
    });
  }
};

// 클릭 시 툴팁 토글 (한 번 누르면 표시, 같은 지점을 한 번 더 누르면 숨김)
// 히트박스는 각 점(또는 막대) 자체를 기준으로 하며, 기존 대비 1.5배 넓게 잡는다. 스크롤 동작은 무시한다.
function attachTooltipToggle(chart){
  let lockedIndex = null;
  let touchStartX = 0, touchStartY = 0, moved = false;
  const canvas = chart.canvas;
  const HIT_R = 24; // 점 히트박스 반경 (기존 16px 대비 1.5배)
  canvas.addEventListener('touchstart', (e)=>{
    if(e.touches && e.touches[0]){ touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; moved = false; }
  }, {passive:true});
  canvas.addEventListener('touchmove', (e)=>{
    if(e.touches && e.touches[0]){
      const dx = Math.abs(e.touches[0].clientX - touchStartX);
      const dy = Math.abs(e.touches[0].clientY - touchStartY);
      if(dx > 6 || dy > 6) moved = true;
    }
  }, {passive:true});
  canvas.onclick = (evt)=>{
    if(moved){ moved = false; return; } // 스크롤/드래그 동작은 무시
    const rect = canvas.getBoundingClientRect();
    const touchX = evt.clientX - rect.left;
    const touchY = evt.clientY - rect.top;

    // 각 점(원)을 기준으로 가장 가까우면서 히트박스(HIT_R) 안에 들어온 지점의 index를 찾는다
    let idx = -1, bestDist = Infinity;
    chart.data.datasets.forEach((ds,di)=>{
      const meta = chart.getDatasetMeta(di);
      if(meta.hidden) return;
      meta.data.forEach((pt,i)=>{
        const v = ds.data[i];
        if(v===null || v===undefined) return;
        const dx = touchX - pt.x, dy = touchY - pt.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if(dist <= HIT_R && dist < bestDist){ bestDist = dist; idx = i; }
      });
    });
    if(idx === -1) return; // 점 근처가 아니면 무시

    if(lockedIndex !== null){
      chart.tooltip.setActiveElements([], {x:0,y:0});
      chart.setActiveElements([]);
      lockedIndex = null;
    } else {
      const active = chart.data.datasets
        .map((ds,di)=>({datasetIndex:di, index:idx}))
        .filter(a=>!chart.getDatasetMeta(a.datasetIndex).hidden && chart.data.datasets[a.datasetIndex].data[idx]!==null && chart.data.datasets[a.datasetIndex].data[idx]!==undefined);
      const metaForIdx = chart.getDatasetMeta(active.length ? active[0].datasetIndex : 0);
      const pt = metaForIdx && metaForIdx.data[idx];
      chart.tooltip.setActiveElements(active, pt ? {x:pt.x,y:pt.y} : {x:0,y:0});
      chart.setActiveElements(active);
      lockedIndex = idx;
    }
    chart.update();
  };
}

// 막대그래프용 클릭 토글: 각 막대 영역(1.5배 확장)을 히트박스로 사용
function attachBarTooltipToggle(chart){
  let locked = false;
  let touchStartX = 0, touchStartY = 0, moved = false;
  const canvas = chart.canvas;
  canvas.addEventListener('touchstart', (e)=>{
    if(e.touches && e.touches[0]){ touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; moved = false; }
  }, {passive:true});
  canvas.addEventListener('touchmove', (e)=>{
    if(e.touches && e.touches[0]){
      const dx = Math.abs(e.touches[0].clientX - touchStartX);
      const dy = Math.abs(e.touches[0].clientY - touchStartY);
      if(dx > 6 || dy > 6) moved = true;
    }
  }, {passive:true});
  canvas.onclick = (evt)=>{
    if(moved){ moved = false; return; }
    const rect = canvas.getBoundingClientRect();
    const touchX = evt.clientX - rect.left;
    const touchY = evt.clientY - rect.top;
    const meta = chart.getDatasetMeta(0);
    let idx = -1;
    meta.data.forEach((bar,i)=>{
      const props = bar.getProps ? bar.getProps(['x','y','base','width'], true) : bar;
      const w = (props.width || 24) * 1.5; // 가로 1.5배
      const padY = 15; // 세로 여유(기존 10px 대비 1.5배)
      const xMin = props.x - w/2, xMax = props.x + w/2;
      const yTop = Math.min(props.y, props.base) - padY;
      const yBottom = Math.max(props.y, props.base) + padY;
      if(touchX >= xMin && touchX <= xMax && touchY >= yTop && touchY <= yBottom){ idx = i; }
    });
    if(idx === -1) return;

    if(locked){
      chart.tooltip.setActiveElements([], {x:0,y:0});
      chart.setActiveElements([]);
      locked = false;
    } else {
      const bar = meta.data[idx];
      chart.tooltip.setActiveElements([{datasetIndex:0, index:idx}], bar ? {x:bar.x,y:bar.y} : {x:0,y:0});
      chart.setActiveElements([{datasetIndex:0, index:idx}]);
      locked = true;
    }
    chart.update();
  };
}

function examTrendPoints(seriesKey){
  const rows = dedupeLatest(personScores().filter(r=> seriesKey==='total' || r.type===seriesKey),
    r=>r.author+'|'+r.examName+'|'+r.type+'|'+r.subject);
  const byExam = {};
  rows.forEach(r=>{
    if(!byExam[r.examName]) byExam[r.examName] = { score:0, date:r.examDate };
    byExam[r.examName].score += Number(r.score)||0;
  });
  return byExam;
}
function allExamLabelsForActiveSeries(){
  const set = new Set();
  [...examSeriesActive].forEach(s=>{ Object.keys(examTrendPoints(s)).forEach(n=>set.add(n)); });
  examAvgActive.forEach(s=>{
    examData.averages.forEach(a=>{ if(s==='total' || a.type===s) set.add(a.examName); });
  });
  return [...set].sort((a,b)=>{
    const da = examData.scores.find(r=>r.examName===a)?.examDate || examData.averages.find(r=>r.examName===a)?.examDate;
    const db = examData.scores.find(r=>r.examName===b)?.examDate || examData.averages.find(r=>r.examName===b)?.examDate;
    return new Date(da) - new Date(db);
  });
}
function seriesMax(s){ return s==='total'?80:s==='A'?39:41; }

function renderExamTrend(){
  const labelsRaw = allExamLabelsForActiveSeries();
  const dateOf = {};
  examData.scores.forEach(r=>{ dateOf[r.examName]=r.examDate; });
  examData.averages.forEach(a=>{ if(!dateOf[a.examName]) dateOf[a.examName]=a.examDate; });
  const labels = labelsRaw.map(n=>multiLineLabel(n, dateOf[n]));

  // 회차별 재언이 기록한 A/B 평균 (총점 평균 = A형 평균+B형 평균)
  const avgByExam = {};
  examData.averages.forEach(a=>{
    if(!avgByExam[a.examName]) avgByExam[a.examName] = {A:null,B:null};
    avgByExam[a.examName][a.type] = Number(a.averageScore||0);
  });
  function avgFor(n, seriesKey){
    const rec = avgByExam[n];
    if(!rec) return null;
    if(seriesKey==='A') return rec.A;
    if(seriesKey==='B') return rec.B;
    if(rec.A===null && rec.B===null) return null;
    return (rec.A||0)+(rec.B||0);
  }
  const avgLabelOf = { total:'총점 평균', A:'A형 평균', B:'B형 평균' };

  const datasets = [...examSeriesActive].map(s=>{
    const pts = examTrendPoints(s);
    const max = seriesMax(s);
    const rawScores = labelsRaw.map(n=> pts[n] ? pts[n].score : null);
    const data = rawScores.map(v=> v===null?null: (examMode==='score' ? v : Math.round(v/max*1000)/10));
    const avgRaw = labelsRaw.map(n=>avgFor(n,s));
    return {
      seriesKey:s,
      label: s==='total'?'총점':s==='A'?'A형':'B형',
      data, rawScores, maxScore:max, avgRaw,
      borderColor: SERIES_COLOR[s], backgroundColor: SERIES_COLOR[s],
      tension:.2, pointRadius:4, pointHitRadius:10, spanGaps:true
    };
  });

  // 사용자가 직접 켠 평균만 흰색 점(선 없음)으로 표시
  [...examAvgActive].forEach(s=>{
    const max = seriesMax(s);
    const rawScores = labelsRaw.map(n=>avgFor(n,s));
    const data = rawScores.map(v=> v===null?null: (examMode==='score'? v : Math.round(v/max*1000)/10));
    datasets.push({
      seriesKey:s, isAvgDataset:true, label: avgLabelOf[s],
      data, rawScores, maxScore:max,
      showLine:false, pointBackgroundColor:'transparent', pointBorderColor:SERIES_COLOR[s], pointBorderWidth:2, pointRadius:5, pointHitRadius:10, pointStyle:'circle',
      borderColor:SERIES_COLOR[s]
    });
  });

  const ctx = document.getElementById('examTrendChart');
  if(examTrendChart) examTrendChart.destroy();
  fitChartWidth('examTrendChart', labels.length);
  const activeTypes = new Set([...examSeriesActive, ...examAvgActive]);
  const yMax = examMode==='rate' ? 100 : (activeTypes.size ? Math.max(...[...activeTypes].map(seriesMax)) : undefined);
  examTrendChart = new Chart(ctx, {
    type:'line',
    data:{ labels, datasets },
    plugins:[valueLabelPlugin],
    options:{ responsive:true, maintainAspectRatio:false, events:[], interaction:{ mode:'nearest', intersect:false, axis:'x' },
      layout:{ padding:{ top:24 } },
      plugins:{ legend:{display:false},
        tooltip:{ callbacks:{
          title:(items)=> labelsRaw[items[0].dataIndex],
          label:(c)=>{
            const ds = c.dataset;
            const i = c.dataIndex;
            return ds.label+': '+fmtBoth(ds.rawScores[i], ds.maxScore);
          }
        } } },
      scales:{ y:{ beginAtZero:true, max:yMax }, x:{ grid:{display:false}, ticks:{ color: examThemeTextColor() } } } }
  });
  attachTooltipToggle(examTrendChart);
}

function fitChartWidth(canvasId, count){
  const canvas = document.getElementById(canvasId);
  const wrapper = canvas.parentElement;
  const minW = wrapper.parentElement.clientWidth || 600;
  const w = Math.max(minW, count*56);
  wrapper.style.width = w+'px';
}

function renderExamSubjectChart(){
  const rows = dedupeLatest(personScores(), r=>r.author+'|'+r.examName+'|'+r.type+'|'+r.subject);
  const activeList = SUBJECT_META.filter(s=>activeSubjects.has(s.name));

  examNames.sort((a,b)=> new Date(dateOf[a]) - new Date(dateOf[b]));
  const labels = examNames.map(n=>multiLineLabel(n, dateOf[n]));

  const datasets = activeList.map(s=>{
    const rawScores = examNames.map(n=>{
      const row = rows.find(r=>r.examName===n && r.subject===s.name);
      return row ? Number(row.score) : null;
    });
    const data = rawScores.map(v=> v===null?null: (examMode==='score' ? v : Math.round(v/s.max*1000)/10));
    return { label:s.name, data, rawScores, maxScore:s.max, borderColor:s.color, backgroundColor:s.color, tension:.2, pointRadius:4, pointHitRadius:10, spanGaps:true };
  });

  const ctx = document.getElementById('examSubjectChart');
  if(examSubjectChart) examSubjectChart.destroy();
  fitChartWidth('examSubjectChart', labels.length);
  const subjYMax = examMode==='rate' ? 100 : (activeList.length ? Math.max(...activeList.map(s=>s.max)) : undefined);
  const yTicks = examMode==='rate' ? {} : { stepSize:1, precision:0, autoSkip:false };
  examSubjectChart = new Chart(ctx,{
    type:'line',
    data:{ labels, datasets },
    plugins:[valueLabelPlugin],
    options:{ responsive:true, maintainAspectRatio:false, events:[], interaction:{ mode:'nearest', intersect:false, axis:'x' },
      layout:{ padding:{ top:24 } },
      plugins:{ legend:{display:false},
        tooltip:{ callbacks:{
          title:(items)=> examNames[items[0].dataIndex],
          label:(c)=> c.dataset.label+': '+fmtBoth(c.dataset.rawScores[c.dataIndex], c.dataset.maxScore)
        } } },
      scales:{ y:{ beginAtZero:true, max: subjYMax, ticks:yTicks,
        afterBuildTicks: (axis)=>{
          if(examMode==='rate' || subjYMax==null) return;
          const step = subjYMax<=12 ? 1 : Math.ceil(subjYMax/10);
          const ticks = [];
          for(let v=0; v<subjYMax; v+=step) ticks.push({value:v});
          ticks.push({value:subjYMax});
          axis.ticks = ticks;
        }
      }, x:{ grid:{display:false}, ticks:{ color: examThemeTextColor() } } } }
  });
  attachTooltipToggle(examSubjectChart);
}

// ---- 평균 (막대그래프, 점수/정답률 토글 반영) ----
let avgRateChart = null;
function renderAvgRateChart(){
  const rows = dedupeLatest(personScores(), r=>r.author+'|'+r.examName+'|'+r.type+'|'+r.subject);
  const isRate = examMode==='rate';
  function typeAvg(type,max){
    const byExam = {};
    rows.filter(r=>r.type===type).forEach(r=>{ byExam[r.examName]=(byExam[r.examName]||0)+Number(r.score); });
    const exams = Object.values(byExam);
    if(!exams.length) return null;
    const avg = exams.reduce((a,b)=>a+b,0)/exams.length;
    return isRate ? Math.round(avg/max*1000)/10 : Math.round(avg*10)/10;
  }
  function totalAvg(){
    const byExam = {};
    rows.forEach(r=>{ byExam[r.examName]=(byExam[r.examName]||0)+Number(r.score); });
    const exams = Object.values(byExam);
    if(!exams.length) return null;
    const avg = exams.reduce((a,b)=>a+b,0)/exams.length;
    return isRate ? Math.round(avg/80*1000)/10 : Math.round(avg*10)/10;
  }
  const subjAvgs = SUBJECT_META.map(s=>{
    const rs = rows.filter(r=>r.subject===s.name);
    if(!rs.length) return null;
    const avg = rs.reduce((a,r)=>a+Number(r.score),0)/rs.length;
    return isRate ? Math.round(avg/s.max*1000)/10 : Math.round(avg*10)/10;
  });
  const maxScores = [80, 39, 41, ...SUBJECT_META.map(s=>s.max)];
  const labels = ['총점','A형','B형', ...SUBJECT_META.map(s=>s.name)];
  const data = [totalAvg(), typeAvg('A',39), typeAvg('B',41), ...subjAvgs];
  const themeCol = examThemeTextColor();
  const bgColors = [themeCol, themeCol, themeCol, ...SUBJECT_META.map(s=>s.color)];
  const tickColors = [themeCol, themeCol, themeCol, ...SUBJECT_META.map(s=>s.color)];

  const ctx = document.getElementById('avgRateChart');
  if(avgRateChart) avgRateChart.destroy();
  const barOpts = { barPercentage:0.65, categoryPercentage:0.7 };
  const datasets = [];
  if(!isRate){
    // 만점(외곽선) 막대를 먼저 그려서 뒤에 깔리고, 평균 막대가 그 위에 겹쳐 보이도록 함
    datasets.push({
      data: maxScores, backgroundColor:'transparent', borderColor:bgColors, borderWidth:2, borderRadius:4,
      rawScores:maxScores, maxScores, unitLabel:'점', label:'만점', skipLabel:true, order:1, ...barOpts
    });
  }
  datasets.push({ data, backgroundColor:bgColors, borderRadius:4, borderWidth:0,
    rawScores:data, maxScores, unitLabel: isRate?'%':'점', label:'평균', order:2, ...barOpts });
  avgRateChart = new Chart(ctx, {
    type:'bar',
    data:{ labels, datasets },
    plugins:[valueLabelBarPlugin],
    options:{ responsive:true, maintainAspectRatio:false, events:[],
      layout:{ padding:{ top:24 } },
      plugins:{ legend:{display:false},
        tooltip:{ callbacks:{
          title:(items)=> items && items[0] ? items[0].label : '',
          label:(c)=>{
            if(c.raw===null||c.raw===undefined) return '기록 없음';
            const max = c.dataset.maxScores[c.dataIndex];
            if(c.dataset.label==='만점') return `만점 : ${c.raw}점`;
            if(isRate) return `평균 : ${c.raw.toFixed(1)}%`;
            const rate = max ? Math.round(c.raw/max*1000)/10 : 0;
            return `평균 : ${c.raw}/${max}점 (${rate}%)`;
          }
        } } },
      scales:{ y:{ beginAtZero:true, max: isRate ? 100 : Math.max(...maxScores) }, x:{ grouped:false, grid:{display:false}, ticks:{ font:{ size:10 }, color: (c)=>tickColors[c.index] } } } }
  });
  attachBarTooltipToggle(avgRateChart);
}
const valueLabelBarPlugin = {
  id:'valueLabelBarPlugin',
  afterDatasetsDraw(chart){
    const ctx = chart.ctx;
    chart.data.datasets.forEach((ds,di)=>{
      if(ds.skipLabel) return;
      const meta = chart.getDatasetMeta(di);
      meta.data.forEach((bar,i)=>{
        const v = ds.data[i];
        if(v===null || v===undefined) return;
        ctx.save();
        ctx.font = '9px sans-serif';
        ctx.fillStyle = Array.isArray(ds.backgroundColor) ? ds.backgroundColor[i] : (ds.backgroundColor||'#888');
        ctx.textAlign = 'center';
        ctx.fillText(v + (ds.unitLabel || '%'), bar.x, bar.y - 6);
        ctx.restore();
      });
    });
  }
};

let swAuthor = '재언';
let swTerms = new Set(['all']);

function buildSwAuthorToggle(){
  const wrap = document.getElementById('swAuthorToggle');
  if(!wrap) return;
  wrap.innerHTML = ['재언','태현'].map(name=>{
    const on = swAuthor===name;
    return `<button class="ttab${on?' on':''}" onclick="selectSwAuthor('${name}')">${name}</button>`;
  }).join('');
}
function selectSwAuthor(name){
  swAuthor = name;
  renderStudyWrongPage();
}

let swSubject = '전체'; // 토글: 전체가 기본값
function buildSwSubjectSelect(){
  const wrap = document.getElementById('swSubjectTabs');
  if(!wrap) return;
  const names = ['전체', ...SUBJECT_META.map(s=>s.name)];
  wrap.innerHTML = names.map(name=>{
    const on = swSubject===name;
    const color = name==='전체' ? 'var(--accent)' : (SUBJECT_META.find(s=>s.name===name)||{}).color;
    const style = color ? subjectBtnStyle(on,color) : '';
    return `<button class="stab${on?' on':''}" style="${style}" onclick="selectSwSubject('${name}')">${name}</button>`;
  }).join('');
}
function selectSwSubject(name){
  swSubject = name;
  buildSwSubjectSelect();
  renderStudyWrongPage();
}

function buildSwTermTabs(){
  const wrap = document.getElementById('swTermTabs');
  if(!wrap) return;
  const opts = [{v:'all',l:'전체'},{v:'1',l:'1텀'},{v:'2',l:'2텀'},{v:'3',l:'3텀'}];
  wrap.innerHTML = opts.map(o=>{
    const on = swTerms.has(o.v);
    return `<button class="stab${on?' on':''}" style="${on?'border-color:var(--accent);color:var(--accent);background:var(--accent3)':''}" onclick="toggleSwTerm('${o.v}')">${o.l}</button>`;
  }).join('');
}
function toggleSwTerm(v){
  if(v==='all'){
    swTerms = new Set(['all']);
  } else {
    swTerms.delete('all');
    if(swTerms.has(v)) swTerms.delete(v); else swTerms.add(v);
    if(swTerms.size===0) swTerms.add('all');
  }
  buildSwTermTabs();
  renderStudyWrongPage();
}

function renderStudyWrongPage(){
  buildSwAuthorToggle();
  buildSwSubjectSelect();
  buildSwTermTabs();

  const listEl = document.getElementById('swWrongList');
  if(!listEl) return;
  const rows = (S.studyWrongAnswers||[]).slice();

  const filtered = rows.filter(r=>
    r.author===swAuthor &&
    (swTerms.has('all') || swTerms.has(String(r.term))) &&
    (swSubject==='전체' || r.subject===swSubject)
  );

  if(swSubject==='전체'){
    // 텀순 → 모고탭 과목순서 → 회차순
    filtered.sort((a,b)=>{
      if(a.term!==b.term) return a.term-b.term;
      const ai = SUBJECT_META.findIndex(s=>s.name===a.subject);
      const bi = SUBJECT_META.findIndex(s=>s.name===b.subject);
      if(ai!==bi) return (ai===-1?999:ai)-(bi===-1?999:bi);
      return (a.roundSortKey||0)-(b.roundSortKey||0) || (a.createdAt||'').localeCompare(b.createdAt||'');
    });
  } else {
    filtered.sort((a,b)=>{
      if(a.term!==b.term) return a.term-b.term;
      return (a.roundSortKey||0)-(b.roundSortKey||0) || (a.createdAt||'').localeCompare(b.createdAt||'');
    });
  }

  if(!filtered.length){
    listEl.innerHTML = '<div style="color:var(--text3);font-size:13px;padding:12px 0">기록된 오답이 없습니다.</div>';
    return;
  }

  listEl.innerHTML = filtered.map(r=>{
    const s = SUBJECT_META.find(x=>x.name===r.subject);
    const color = s ? s.color : 'var(--accent)';
    return `<div class="nc" style="margin-bottom:10px;padding:12px 14px">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px">
        <span style="font-weight:600;color:${color}">${r.subject}</span>
        <span style="font-size:12px;color:var(--text3)">${r.term}텀</span>
        ${r.round?`<span style="font-size:11px;color:var(--text3)">· ${r.round}</span>`:''}
      </div>
      <div style="font-size:13px;color:var(--text);white-space:pre-wrap">${r.note}</div>
    </div>`;
  }).join('');
}

  onWrongQueryModeChange();
}
function onWrongQueryModeChange(){
  const mode = document.getElementById('wrongQueryMode').value;
  document.getElementById('wrongExamRow').style.display = mode==='subject' ? 'none' : 'flex';
  document.getElementById('wrongSubjectRow').style.display = mode==='subject' ? 'flex' : 'none';
  renderWrongList();
}
function onWrongBaseChange(){
  const base = document.getElementById('wrongExamBase').value;
  const tree = examTree();
  const t = tree.find(x=>x.base===base);
  const roundSel = document.getElementById('wrongExamRound');

function currentWrongExamName(){

  const round = document.getElementById('wrongExamRound').value;

}
function renderWrongList(){
  const el = document.getElementById('wrongAnswerList');
  const modeSel = document.getElementById('wrongQueryMode');
  const mode = modeSel ? modeSel.value : 'exam';

  if(mode==='subject'){
    const subject = document.getElementById('wrongSubjectSelect').value;
    const s = SUBJECT_META.find(x=>x.name===subject);
    const rows = examData.wrongAnswers.filter(r=>r.author===examPerson && r.subject===subject);
    const dateOf = {}; examData.scores.forEach(r=>{ dateOf[r.examName]=r.examDate; });
    rows.sort((a,b)=> new Date(dateOf[a.examName]||a.examDate) - new Date(dateOf[b.examName]||b.examDate));
    const items = rows.map(r=>{
      const { title, round } = splitExamLabel(r.examName);
      const roundLabel = round ? (title+' '+round) : title;
      return `<div style="display:flex;gap:8px;padding:8px 10px;background:var(--bg3,rgba(127,119,221,.06));border-radius:8px;font-size:13px;margin-bottom:6px">
        <span style="font-weight:600;min-width:88px;flex-shrink:0;color:${s?s.color:''}">${roundLabel}</span><span style="white-space:pre-wrap">${r.note}</span>
      </div>`;
    }).join('');
    el.innerHTML = items || '<div style="font-size:13px;color:var(--text3)">기록된 오답이 없습니다.</div>';
    return;
  }

  const examName = currentWrongExamName();
  const rows = examData.wrongAnswers.filter(r=>r.author===examPerson && r.examName===examName);
  const bySubject = {};
  rows.forEach(r=>{ bySubject[r.subject]=r.note; });
  const items = SUBJECT_META.filter(s=>bySubject[s.name]).map(s=>
    `<div style="display:flex;gap:8px;padding:8px 10px;background:var(--bg3,rgba(127,119,221,.06));border-radius:8px;font-size:13px;margin-bottom:6px">
      <span style="font-weight:600;min-width:78px;flex-shrink:0;color:${s.color}">${s.name}</span><span style="white-space:pre-wrap">${bySubject[s.name]}</span>
    </div>`
  ).join('');
  el.innerHTML = items || '<div style="font-size:13px;color:var(--text3)">기록된 오답이 없습니다.</div>';
}

// ---- record modal ----
function openRecordModal(){
  if(!examPerson) return;
  document.getElementById('recordModalTitle').textContent = examPerson+' 기록 추가';
  recordMode = examSection==='wrong' ? 'wrong' : 'score';
  document.getElementById('recordModeTabs').innerHTML = ['score','wrong'].map(m=>{
    const on = recordMode===m;
    return `<button class="stab${on?' on':''}" data-mode="${m}" style="${on?'border-color:var(--accent);color:var(--accent);background:var(--accent3)':''}" onclick="setRecordMode('${m}',this)">${m==='score'?'점수 기록':'오답 기록'}</button>`;
  }).join('');
  const tree = examTree();
  document.getElementById('rec-examBase').innerHTML = tree.map(t=>`<option value="${t.base}">${t.base}</option>`).join('');
  onRecBaseChange();
  document.getElementById('rec-examDate').value = new Date().toISOString().slice(0,10);
  document.getElementById('record-status').textContent='';
  setRecordMode(recordMode);
  document.getElementById('recordModalBg').style.display='flex';
}
function closeRecordModal(){ document.getElementById('recordModalBg').style.display='none'; }
function onRecBaseChange(){
  const base = document.getElementById('rec-examBase').value;
  const tree = examTree();
  const t = tree.find(x=>x.base===base);
  const roundSel = document.getElementById('rec-examRound');
  if(!t || (t.rounds.length===1 && t.rounds[0]==='')){
    roundSel.innerHTML = '<option value="">-</option>';
  } else {
    roundSel.innerHTML = t.rounds.map(r=>`<option value="${r}">${r}</option>`).join('');
  }
  prefillRecordFields();
}
function currentRecExamName(){
  const base = document.getElementById('rec-examBase').value;
  const round = document.getElementById('rec-examRound').value;
  return fullExamName(base, round);
}
function setRecordMode(m,btn){
  recordMode=m;
  document.querySelectorAll('#recordModeTabs .stab').forEach(b=>{ b.classList.remove('on'); b.style.cssText=''; });
  const activeBtn = btn || document.querySelector(`#recordModeTabs .stab[data-mode="${m}"]`) || document.querySelector('#recordModeTabs .stab');
  if(activeBtn){ activeBtn.classList.add('on'); activeBtn.style.cssText='border-color:var(--accent);color:var(--accent);background:var(--accent3)'; }
  document.getElementById('rec-scoreFields').style.display = m==='score'?'':'none';
  document.getElementById('rec-wrongFields').style.display = m==='wrong'?'':'none';
  document.getElementById('rec-avgField').style.display = (m==='score' && examPerson==='재언')?'':'none';
  buildRecordFields();
  prefillRecordFields();
}
function buildRecordFields(){
  if(recordMode==='score'){
    document.getElementById('rec-scoreFields').innerHTML = SUBJECT_META.map((s,i)=>
      `<div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">
        <label style="width:78px;flex-shrink:0;font-size:13px;color:${s.color}">${s.name}</label>
        <span style="font-size:11px;color:var(--text3);width:32px;flex-shrink:0">${s.max}점</span>
        <input type="number" min="0" max="${s.max}" id="rec-score-${i}" style="flex:1;padding:4px 6px">
      </div>`
    ).join('');
  } else {
    document.getElementById('rec-wrongFields').innerHTML = SUBJECT_META.map((s,i)=>
      `<div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">
        <label style="width:78px;flex-shrink:0;font-size:13px;color:${s.color}">${s.name}</label>
        <textarea id="rec-wrong-${i}" placeholder="오답 내용 (줄바꿈 가능)" style="flex:1;padding:4px 6px;min-height:32px;resize:vertical;font-family:inherit;line-height:1.5"></textarea>
      </div>`
    ).join('');
  }
}
function prefillRecordFields(){
  const examName = currentRecExamName();
  if(!examName) return;
  if(recordMode==='score'){
    const rows = dedupeLatest(personScores().filter(r=>r.examName===examName), r=>r.subject);
    SUBJECT_META.forEach((s,i)=>{
      const el = document.getElementById('rec-score-'+i);
      if(!el) return;
      const row = rows.find(r=>r.subject===s.name);
      el.value = row ? row.score : '';
    });
    if(examPerson==='재언'){
      const avgA = examData.averages.filter(a=>a.examName===examName && a.type==='A').slice(-1)[0];
      const avgB = examData.averages.filter(a=>a.examName===examName && a.type==='B').slice(-1)[0];
      document.getElementById('rec-avgScoreA').value = avgA ? avgA.averageScore : '';
      document.getElementById('rec-avgScoreB').value = avgB ? avgB.averageScore : '';
    }
    const scoreRows = personScores().filter(r=>r.examName===examName);
    if(scoreRows.length) document.getElementById('rec-examDate').value = scoreRows[scoreRows.length-1].examDate;
  } else {
    const rows = examData.wrongAnswers.filter(r=>r.author===examPerson && r.examName===examName);
    SUBJECT_META.forEach((s,i)=>{
      const el = document.getElementById('rec-wrong-'+i);
      if(!el) return;
      const row = rows.slice().reverse().find(r=>r.subject===s.name);
      el.value = row ? row.note : '';
    });
  }
}
async function submitRecord(){
  const statusEl = document.getElementById('record-status');
  const examName = currentRecExamName();
  const examDate = document.getElementById('rec-examDate').value;
  if(!examName || !examDate){ statusEl.textContent='회차와 날짜를 확인해주세요.'; return; }
  statusEl.textContent='저장 중...';
  try{
    if(recordMode==='score'){
      const itemsA = SUBJECT_META.filter(s=>s.type==='A').map((s,idx)=>{
        const i = SUBJECT_META.indexOf(s);
        return { subject:s.name, score:Number(document.getElementById('rec-score-'+i).value||0), maxScore:s.max };
      });
      const itemsB = SUBJECT_META.filter(s=>s.type==='B').map((s)=>{
        const i = SUBJECT_META.indexOf(s);
        return { subject:s.name, score:Number(document.getElementById('rec-score-'+i).value||0), maxScore:s.max };
      });
      await fetch(MOCK_EXAM_API_URL,{ method:'POST', body:JSON.stringify({ target:'scores', author:examPerson, examName, type:'A', examDate, items:itemsA })});
      await fetch(MOCK_EXAM_API_URL,{ method:'POST', body:JSON.stringify({ target:'scores', author:examPerson, examName, type:'B', examDate, items:itemsB })});
      if(examPerson==='재언'){
        const avgValA = document.getElementById('rec-avgScoreA').value;
        const avgValB = document.getElementById('rec-avgScoreB').value;
        if(avgValA) await fetch(MOCK_EXAM_API_URL,{ method:'POST', body:JSON.stringify({ target:'averages', examName, type:'A', examDate, averageScore:Number(avgValA) })});
        if(avgValB) await fetch(MOCK_EXAM_API_URL,{ method:'POST', body:JSON.stringify({ target:'averages', examName, type:'B', examDate, averageScore:Number(avgValB) })});
      }
    } else {
      const itemsA = SUBJECT_META.filter(s=>s.type==='A').map((s)=>{
        const i = SUBJECT_META.indexOf(s);
        return { subject:s.name, note:document.getElementById('rec-wrong-'+i).value };
      }).filter(it=>it.note && it.note.trim());
      const itemsB = SUBJECT_META.filter(s=>s.type==='B').map((s)=>{
        const i = SUBJECT_META.indexOf(s);
        return { subject:s.name, note:document.getElementById('rec-wrong-'+i).value };
      }).filter(it=>it.note && it.note.trim());
      if(itemsA.length) await fetch(MOCK_EXAM_API_URL,{ method:'POST', body:JSON.stringify({ target:'wrongAnswers', author:examPerson, examName, type:'A', examDate, items:itemsA })});
      if(itemsB.length) await fetch(MOCK_EXAM_API_URL,{ method:'POST', body:JSON.stringify({ target:'wrongAnswers', author:examPerson, examName, type:'B', examDate, items:itemsB })});
    }
    await fetchExamData();
    renderExamRecordTable();
    renderExamTrend(); renderExamSubjectTabs(); renderAvgRateChart(); buildWrongExamSelects(); renderWrongList();
    statusEl.textContent='저장 완료!';
    statusEl.style.color = 'var(--accent)';
    setTimeout(()=>{
      closeRecordModal();
      statusEl.style.color = '';
    }, 700);
  }catch(e){
    statusEl.textContent='저장 실패: '+e;
  }
}
