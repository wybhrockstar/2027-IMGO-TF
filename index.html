<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>✍🏻 2027 IMGO TF</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c8f060">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="2027 IMGO">
<link rel="apple-touch-icon" href="icons/icon_192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a1a1a;--bg2:#222222;--bg3:#2a2a2a;--bg4:#323232;--bg5:#3a3a3a;
  --border:rgba(255,255,255,0.10);--border2:rgba(255,255,255,0.18);--border3:rgba(255,255,255,0.28);
  --text:#f0f0f0;--text2:#c0c0c0;--text3:#888;--text4:#555;
  --accent:#c8f060;--accent2:rgba(200,240,96,0.15);--accent3:rgba(200,240,96,0.08);
  --red:#ff5f5f;--amber:#ffb347;--blue:#6eb5ff;--purple:#b8a5ff;--teal:#5ecfb0;--pink:#ff8fa3;
  --r:10px;--rs:6px;
}
body.light{
  --bg:#f7f7f2;--bg2:#eeeee9;--bg3:#ffffff;--bg4:#f2f2ed;--bg5:#e8e8e3;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.14);--border3:rgba(0,0,0,0.22);
  --text:#1a1a1a;--text2:#444;--text3:#888;--text4:#bbb;
  --accent:#5a8a10;--accent2:rgba(90,138,16,0.1);--accent3:rgba(90,138,16,0.06);
  --red:#d93025;--amber:#c87800;--blue:#1a6fc4;--purple:#6b4fc4;--teal:#1a8a6a;--pink:#c4204a;
}
.theme-btn{font-size:16px;padding:4px 8px;border-radius:20px;border:1px solid var(--border2);background:none;color:var(--text3);transition:.15s;line-height:1;cursor:pointer}
.theme-btn:hover{border-color:var(--accent);color:var(--accent)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.6}
button{font-family:'Noto Sans KR',sans-serif;cursor:pointer}
input,select,textarea{font-family:'Noto Sans KR',sans-serif;font-size:14px;color:var(--text);background:var(--bg4);border:1px solid var(--border2);border-radius:var(--rs);padding:8px 10px;outline:none;transition:.15s;width:100%}

/* ── HEADER ── */
.hdr{border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;background:var(--bg);position:sticky;top:0;z-index:200}
.logo{font-weight:700;font-size:15px;color:var(--accent);letter-spacing:.04em}
.hdr-right{display:flex;align-items:center;gap:10px}
.dday{font-family:'JetBrains Mono',monospace;font-size:12px;background:var(--accent2);border:1px solid var(--accent);color:var(--accent);padding:3px 12px;border-radius:20px}

/* ── NAV ── */
.nav{display:flex;gap:0;padding:0 16px;border-bottom:1px solid var(--border);background:var(--bg);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.ntab{padding:12px 16px;font-size:13px;font-weight:500;color:var(--text3);background:none;border:none;border-bottom:2px solid transparent;transition:.15s;white-space:nowrap}
.ntab:hover{color:var(--text2)}
.ntab.on{color:var(--accent);border-bottom-color:var(--accent)}

/* ── MAIN ── */
.main{padding:20px 20px 80px;max-width:900px}
.page{display:none}.page.on{display:block}
.sec-title{font-size:11px;font-weight:700;letter-spacing:.12em;color:#fff;text-transform:uppercase;margin-bottom:14px}
body.light .sec-title{color:var(--text3)}

/* ── TERM TABS ── */
.term-tabs{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap}
.ttab{padding:6px 16px;font-size:12px;font-weight:500;border-radius:20px;border:1px solid var(--border2);color:var(--text3);background:none;transition:.15s}
.ttab:hover{border-color:var(--accent);color:var(--accent)}
.ttab.on{background:var(--accent2);border-color:var(--accent);color:var(--accent)}

/* ── STATS ── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:22px}
.sc{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.sc-label{font-size:11px;color:var(--text3);margin-bottom:5px}
.sc-val{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:500}
.sc-sub{font-size:11px;color:var(--text3);margin-top:2px}

/* ── WEEKLY 뽀개기 (3rd Term) ── */
.pp-wrap{margin-bottom:26px}
.pp-tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.pp-day{padding:6px 0;font-size:12px;font-weight:500;border-radius:var(--rs);border:1px solid var(--border2);background:var(--bg4);color:var(--text2);cursor:pointer}
body.light .pp-day{background:var(--bg3)}
.pp-day.sel{border-color:var(--text);color:var(--text);background:rgba(255,255,255,.1)}
body.light .pp-day.sel{background:rgba(0,0,0,.06)}
.pp-day.today{border-color:var(--accent);background:var(--accent3);color:var(--accent)}
.pp-card{margin-top:6px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:2px 14px}
.pp-row{display:grid;grid-template-columns:54px minmax(0,1fr);gap:8px;align-items:start;padding:11px 0;border-bottom:1px solid var(--border)}
.pp-row:last-child{border-bottom:none}
.pp-lab{box-sizing:border-box;width:54px;text-align:center;font-size:9px;line-height:14px;color:var(--text2);border:1px solid var(--border2);border-radius:6px;padding:2px 0;white-space:nowrap}
.pp-val{font-size:10px;color:var(--text);line-height:18px;padding-top:1px;word-break:keep-all;overflow-wrap:break-word}
.pp-g{color:var(--text3)}
.pp-gb{color:var(--text3);font-weight:700}

/* ── CALENDAR ── */
.cal-wrap{margin-bottom:26px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-hd{text-align:center;font-size:11px;color:var(--text2);padding:6px 2px;font-weight:500}
.cc{background:var(--bg4);border:1px solid var(--border2);border-radius:var(--rs);padding:6px 5px;min-height:64px;height:auto}
.cc.today{border-color:var(--accent);background:var(--accent3)}
.cc.sday{border-color:rgba(94,207,176,.3)}
.cc.empty{background:transparent;border-color:transparent}
.cd{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text2);margin-bottom:3px}
body.light .cal-hd{color:var(--text3)}
body.light .cc{background:var(--bg3);border-color:var(--border)}
body.light .cd{color:var(--text3)}
.cc.today .cd{color:var(--accent);font-weight:500}
.cc-sub{font-size:9px;color:var(--teal);line-height:1.35;word-break:keep-all;overflow-wrap:break-word}
.cc-time{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--text3);margin-top:1px}

/* ── SCHEDULE ── */
.wdiv{font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace;letter-spacing:.05em;padding:8px 0 9px;border-top:1px solid var(--border);margin-bottom:6px}
.wdiv:first-child{border-top:none}
.sr{display:grid;grid-template-columns:auto 1fr auto;align-items:start;gap:10px;padding:9px 12px;border-radius:var(--rs);border:1px solid transparent;transition:.12s}
.sr:hover{background:var(--bg3);border-color:var(--border)}
.sr.today-row{background:var(--accent3);border-color:rgba(200,240,96,.15)}
.sr-date{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text2);white-space:nowrap}
.sr-day{font-size:10px;color:var(--text3)}
.sr-sub{font-size:13px;color:var(--text)}
.sr-note{font-size:11px;color:var(--text3)}
.sr-note-hi{font-size:11px;color:var(--amber)}
.sr-time{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--teal);white-space:nowrap;text-align:right}
.sr-time.pass{color:var(--text3)}
.sr-time.text{color:var(--amber);font-family:'Noto Sans KR',sans-serif}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:7px;vertical-align:middle;flex-shrink:0;margin-top:-1px}
.dot-mon{background:var(--accent)}.dot-wed{background:var(--blue)}.dot-fri{background:var(--purple)}.dot-sun{background:var(--amber)}.dot-sat{background:var(--red)}.dot-else{background:var(--teal)}

/* ── LECTURES ── */
.subj-tabs{display:flex;gap:5px;margin-bottom:18px;flex-wrap:wrap}
.stab{padding:5px 13px;font-size:12px;border-radius:20px;border:1px solid var(--border2);color:var(--text3);background:none;transition:.12s}
.stab:hover{border-color:var(--blue);color:var(--blue)}
.stab.on{background:rgba(110,181,255,.1);border-color:var(--blue);color:var(--blue)}
.apply-btn{padding:8px 18px;font-size:13px;font-weight:600;border-radius:20px;border:1px solid var(--accent);color:var(--bg);background:var(--accent);transition:.15s;cursor:pointer}
.apply-btn:hover{opacity:.85}
.apply-btn:active{transform:scale(.97)}
.apply-btn-sm{padding:5px 13px;font-size:12px;font-weight:600;border-radius:20px;border:1px solid var(--accent);color:var(--bg);background:var(--accent);transition:.15s;cursor:pointer}
.apply-btn-sm:hover{opacity:.85}
.ss{position:relative;height:34px;margin-top:2px;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:pointer}
.ss-track{position:absolute;top:15px;height:4px;border-radius:2px;background:var(--border2)}
.ss-thumb{position:absolute;top:-5.5px;width:15px;height:15px;margin-left:-7.5px;border-radius:50%;background:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.45);transition:opacity .12s}
.ss-thumb.idle{opacity:.35}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.card-tools{display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.card-tools .subj-tabs{margin:0;gap:5px;flex-wrap:nowrap}
.card-tools .stab,.card-tools .apply-btn-sm{padding:4px 10px;font-size:11px;white-space:nowrap}
.apply-btn-sm:active{transform:scale(.97)}
.lec-list{display:grid;grid-template-columns:1fr;gap:5px}
@media(min-width:560px){.lec-list{grid-template-columns:repeat(2,1fr)}}
.li{display:flex;align-items:flex-start;gap:9px;padding:9px 11px;background:var(--bg4);border:1px solid var(--border2);border-radius:var(--rs);transition:.12s}
.li:hover{border-color:var(--border3);background:var(--bg5)}
.li.old{background:var(--bg3);border-color:var(--border)}
.li.old:hover{border-color:var(--border2)}
.li.old .lnum{color:var(--amber)}
body.light .li{background:var(--bg3);border-color:var(--border)}
body.light .li:hover{background:var(--bg4);border-color:var(--border2)}
body.light .li.old{background:var(--bg4);border-color:var(--border2)}
body.light .li.old:hover{background:var(--bg5);border-color:var(--border3)}
.lnum{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--teal);white-space:nowrap;padding-top:2px;min-width:34px}
.ltitle{font-size:12px;color:var(--text);line-height:1.5}
.old-badge{font-size:9px;background:rgba(255,179,71,.15);color:var(--amber);border:1px solid rgba(255,179,71,.3);padding:1px 6px;border-radius:10px;margin-left:6px;white-space:nowrap;vertical-align:middle}
.lec-old-toggle{display:flex;align-items:center;gap:9px;margin:-4px 0 16px;color:var(--text2);font-size:12px}
.toggle-wrap{position:relative;display:inline-block;width:42px;height:24px;flex:0 0 auto}
.toggle-wrap input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;inset:0;background:var(--bg4);border:1px solid var(--border2);border-radius:999px;transition:.18s}
.slider:before{content:"";position:absolute;width:18px;height:18px;left:2px;top:2px;background:var(--text3);border-radius:50%;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle-wrap input:checked + .slider{background:var(--amber2,rgba(255,179,71,.15));border-color:rgba(255,179,71,.45)}
.toggle-wrap input:checked + .slider:before{transform:translateX(18px);background:var(--amber)}

/* ── NOTICE ── */
.nc{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:14px}
.exam-score-table{width:100%;border-collapse:collapse;font-size:12px}
.exam-score-table th{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;padding:6px 6px;border-bottom:1px solid var(--border2);text-align:center;white-space:nowrap}
.exam-score-table td{padding:8px 6px;border-bottom:1px solid var(--border);text-align:center;white-space:nowrap;font-family:'JetBrains Mono',monospace}
.exam-score-table td.exam-score-name{font-family:'Noto Sans KR',sans-serif;text-align:left;color:var(--text)}
.exam-score-table tr:last-child td{border-bottom:none}
.nc-stitle{font-size:11px;color:#fff;text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px;font-weight:700}
body.light .nc-stitle{color:var(--text3)}
.nr{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.nr:last-child{border-bottom:none;padding-bottom:0}
.nl{color:var(--text2)}.nv{font-weight:500}.nv.a{color:var(--accent)}
.fine-row{display:flex;align-items:center;gap:10px;padding:9px 13px;background:var(--bg4);border-radius:var(--rs);margin-bottom:5px}
.fine-icon{width:26px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:13px}
.fine-name{font-size:13px;flex:1}.fine-amt{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500}
.link-card{display:flex;align-items:center;gap:12px;padding:13px 16px;background:var(--bg4);border:1px solid var(--border2);border-radius:var(--r);text-decoration:none;transition:.15s;margin-bottom:7px}
.link-card:hover{border-color:var(--accent)}
.link-title{font-size:13px;color:var(--text)}.link-url{font-size:11px;color:var(--text3);margin-top:1px;font-family:'JetBrains Mono',monospace}
.link-arr{color:var(--text3);margin-left:auto;font-size:16px}
.unable-list{display:flex;flex-direction:column;gap:5px}
.ui-item{display:flex;align-items:center;gap:9px;padding:8px 13px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);font-size:13px;color:var(--text2)}
.ucnt{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--amber);min-width:22px;text-align:center}


/* scrollbar */
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
@media(max-width:767px){body{zoom:0.75}}

/* ── EXAMS ── */
.exam-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;letter-spacing:.03em;white-space:nowrap}
.badge-complete{background:rgba(94,207,176,.15);color:var(--teal);border:1px solid rgba(94,207,176,.3)}
.badge-plan{background:rgba(200,240,96,.12);color:var(--accent);border:1px solid rgba(200,240,96,.25)}
.badge-unknown{background:rgba(136,136,136,.12);color:var(--text3);border:1px solid rgba(136,136,136,.2)}
.exam-cnt{font-family:'JetBrains Mono',monospace;font-size:11px;min-width:28px;text-align:right;padding-top:2px}
.exam-cnt.cnt-complete{color:var(--teal)}
.exam-cnt.cnt-plan{color:var(--accent)}
.exam-cnt.cnt-unknown{color:var(--text3)}
.exam-row{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);margin-bottom:5px;transition:.12s}
.exam-row:hover{border-color:var(--border2)}
.exam-cnt{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text3);min-width:28px;text-align:right;padding-top:2px}
.exam-name{font-size:13px;color:var(--text);flex:1;line-height:1.5}
.exam-essay{font-size:10px;color:var(--amber);background:rgba(255,179,71,.15);border:1px solid rgba(255,179,71,.3);padding:1px 6px;border-radius:8px;white-space:nowrap;margin-left:4px;vertical-align:middle}

/* ── 뽀개기 ── */
.bb-top{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bb-sp{flex:1}
.bb-btn{padding:6px 14px;font-size:12px;border-radius:20px;border:1px solid var(--border2);background:none;color:var(--text2);transition:.15s}
.bb-btn:hover{border-color:var(--accent);color:var(--accent)}
.bb-btn.pri{background:var(--accent2);border-color:var(--accent);color:var(--accent)}
.bb-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:.15s}
.bb-card:hover{border-color:var(--accent)}
.bb-ct{font-weight:500}
.bb-cs{font-size:11px;color:var(--text3);margin-top:3px}
.bb-doc{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:14px;font-size:calc(14px*var(--bbfs,1));line-height:2.1;overflow-x:auto}
.bb-doc table{border-collapse:collapse;width:100%;margin:8px 0}
.bb-doc td{border:1px solid var(--border2);padding:6px 8px;vertical-align:top}
.bb-doc td.bb-th{background:var(--accent3);text-align:center;font-weight:500}
.bb-doc h2{font-size:calc(15px*var(--bbfs,1));margin:10px 0}
.bb-doc h3{font-size:calc(14px*var(--bbfs,1));color:var(--accent);margin:14px 0 4px}
.bb-doc p{margin:2px 0}
.bb-doc .contentbox{border:1px solid var(--border2);border-radius:var(--rs);padding:8px 12px;margin:6px 0}
.bb-b{background:var(--accent2);color:transparent;border-radius:4px;cursor:pointer;padding:1px 3px;transition:.1s;user-select:none;-webkit-user-select:none}
.bb-b.open{color:var(--text);background:var(--accent3);outline:1px solid var(--accent)}
@media(hover:hover){.bb-doc.study .bb-b:hover{color:var(--text);background:var(--accent3);outline:1px solid var(--accent)}}
.bb-b.ok{outline:2px solid var(--accent)}
.bb-b.ng{outline:2px solid var(--red);background:rgba(255,95,95,.14)}
.bb-pop{position:absolute;z-index:300;background:var(--bg2);border:1px solid var(--border3);border-radius:10px;padding:4px;display:flex;gap:4px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.bb-ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px}
.bb-md{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:16px;width:100%;max-width:520px;max-height:90vh;overflow:auto}

.bb-sj{padding:5px 11px;font-size:12px;border-radius:20px;border:1px solid var(--c);color:var(--c);background:none;transition:.15s}
.bb-sj.on{background:var(--c);color:#111;font-weight:700}
.bb-lb{display:inline-block;font-size:10px;padding:0 7px;border-radius:10px;border:1px solid var(--c);color:var(--c);margin-right:4px;white-space:nowrap;line-height:16px}
.bb-bar{height:8px;border-radius:4px;background:var(--bg5);overflow:hidden;flex:1}
.bb-bar i{display:block;height:100%}
.bb-row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px}
.bb-row b{width:64px;flex-shrink:0}
.bb-card .apply-btn-sm{margin-left:8px}
.bb-fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:250;padding:12px 22px;border-radius:26px;border:none;background:var(--accent);color:#111;font-weight:700;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.bb-ck{display:inline-flex;width:18px;height:18px;border-radius:50%;background:var(--accent);color:#111;font-size:11px;font-weight:700;align-items:center;justify-content:center;margin-right:6px}
@keyframes bbf{0%,70%{box-shadow:0 0 0 5px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.bb-flash{animation:bbf 2.2s}
</style>
</head>
<body>


<!-- HEADER -->
<div class="hdr">
  <div class="logo">✍🏻 2027 IMGO TF</div>
  <div class="hdr-right">
    <div class="dday" id="ddayBadge">D-?</div>
    <button class="theme-btn" id="themeToggleBtn" onclick="toggleTheme()" title="라이트/다크 전환">🌙</button>
  </div>
</div>

<!-- NAV -->

function updateDday(){
  const parts = (S.dday||'2026-11-07').split('-');
  const dd = new Date(parseInt(parts[0]),parseInt(parts[1])-1,parseInt(parts[2]));
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.ceil((dd-today)/(864e5));

  badge.textContent = diff>0?'D-'+diff:diff===0?'D-DAY ★':'D+'+Math.abs(diff);

function isStudyTimeValue(v){
  return /^\d+:\d{1,2}$/.test(String(v||'').trim());
}
function studyTimeMins(v){
  if(!isStudyTimeValue(v)) return 0;
  const p=String(v).trim().split(':');
  return parseInt(p[0],10)*60+parseInt(p[1],10);
}
function buildStats(t){
  const td = S.schedule[t]||[];

    studyMap[key]={subject:it.subject,time:it.time};
  }));

    const key=`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    const isT=d.getTime()===today.getTime();
    const info=studyMap[key];
    let cls='cc'+(isT?' today':info?' sday':'');

  }

}

// ==================== SCHEDULE LIST ====================
function buildSchedule(t){
  const td=S.schedule[t]||[];
  const ddayParts=(S.dday||'2026-11-07').split('-');
  const ddayDate=new Date(parseInt(ddayParts[0]),parseInt(ddayParts[1])-1,parseInt(ddayParts[2]));
  const today=new Date();today.setHours(0,0,0,0);

  // Flatten all items with their date objects, sorted
  const allItems=[];
  td.forEach(w=>w.items.forEach(it=>{
    if(it.date==='-'){allItems.push({item:it,dateObj:null});return;}
    const p=it.date.split('/');
    const mo=parseInt(p[0]),da=parseInt(p[1]);
    const yr=(mo>=6&&mo<=12)?2026:2027;
    const dateObj=new Date(yr,mo-1,da);
    dateObj.setHours(0,0,0,0);
    allItems.push({item:it,dateObj});
  }));
  allItems.sort((a,b)=>{
    if(!a.dateObj) return 1;
    if(!b.dateObj) return -1;
    return a.dateObj-b.dateObj;
  });

  // Compute D-day for upcoming Monday
  function getDdayForMonday(mondayDate){
    mondayDate.setHours(0,0,0,0);
    const diff=Math.ceil((ddayDate-mondayDate)/(864e5));
    return diff>0?'D-'+diff:diff===0?'D-DAY':'D+'+ Math.abs(diff);
  }

  let html='';
  let lastWeekSunday=null; // tracks the Sunday of the current week

  // Helper: get Monday of the week containing a date (Mon=start)
  function getMondayOf(d){
    const day=d.getDay(); // 0=Sun
    const diff=day===0?-6:1-day;
    const mon=new Date(d);
    mon.setDate(d.getDate()+diff);
    mon.setHours(0,0,0,0);
    return mon;
  }

  for(const {item,dateObj} of allItems){
    if(!dateObj){
      html+=`<div class="sr"><div class="sr-sub" style="color:var(--text3);grid-column:1/-1">${item.subject}</div></div>`;
      continue;
    }
    const monday=getMondayOf(dateObj);
    const mondayKey=monday.getTime();

    if(lastWeekSunday===null||mondayKey>lastWeekSunday){
      // Insert week divider before this item
      const dday=getDdayForMonday(new Date(monday));
      const mondayLabel=`${monday.getMonth()+1}/${monday.getDate()}`;
      html+=`<div class="wdiv">— ${dday} <span style="color:var(--text4);font-size:10px">(${mondayLabel}~)</span></div>`;
      lastWeekSunday=mondayKey;
    }

    const dc=dotColors[item.day]||'var(--teal)';
    const isToday=dateObj.getTime()===today.getTime();
    const rowCls=isToday?' today-row':'';

    // parse subject and note from item
    // note is in item.note field (orange color)
    const hasNumericTime=isStudyTimeValue(item.time);
    const hasTextTime=item.time&&!hasNumericTime;
    const noteH=item.note?`<span class="sr-note-hi"> · ${item.note}</span>`:'';
    const timeH=hasNumericTime?`<div class="sr-time">[${item.time}]</div>`:
                hasTextTime?`<div class="sr-time text">${item.time}</div>`:
                `<div class="sr-time pass">—</div>`;

    html+=`<div class="sr${rowCls}"><div class="sr-date"><span class="dot" style="background:${dc}"></span>${item.date}<span class="sr-day">(${item.day})</span></div><div class="sr-sub">${item.subject}${noteH}</div>${timeH}</div>`;
  }
  document.getElementById('scheduleList').innerHTML=html||'<div style="color:var(--text3);padding:20px 0;font-size:13px">일정이 없습니다.</div>';
}

// ==================== TERM SWITCH ====================
function parseTermPeriod(str){
  // "2026.06.01 ~ 08.17" 형식 파싱
  if(!str) return null;
  const parts = str.split('~').map(s=>s.trim());
  if(parts.length!==2) return null;
  const startM = parts[0].match(/(\d{4})\.(\d{1,2})\.(\d{1,2})/);
  if(!startM) return null;
  const year = parseInt(startM[1]);
  const start = new Date(year, parseInt(startM[2])-1, parseInt(startM[3]));
  let end = null;
  const endFullM = parts[1].match(/(\d{4})\.(\d{1,2})\.(\d{1,2})/);
  const endShortM = parts[1].match(/(\d{1,2})\.(\d{1,2})/);
  if(endFullM){
    end = new Date(parseInt(endFullM[1]), parseInt(endFullM[2])-1, parseInt(endFullM[3]));
  } else if(endShortM){
    let endYear = year;
    if(parseInt(endShortM[1]) < parseInt(startM[2])) endYear = year+1; // 연도 넘어가는 경우
    end = new Date(endYear, parseInt(endShortM[1])-1, parseInt(endShortM[2]));
  }
  return { start, end };
}
function detectCurrentTerm(){
  const today = new Date(); today.setHours(0,0,0,0);
  const terms = [1,2,3]
    .map(t=>({ t, period: parseTermPeriod((S.termPeriods||{})[t]) }))
    .filter(x=>x.period);
  if(!terms.length) return 1;
  terms.sort((a,b)=>a.period.start-b.period.start);
  let result = terms[0].t; // 첫 텀 시작 전이면 1텀 기본 표시
  terms.forEach(({t, period})=>{
    if(today >= period.start) result = t; // 시작한 텀 중 가장 최근 텀
  });
  return result;
}

let _lectureSubjOrderCache = null, _lectureSubjColorCache = null;
function getLectureSubjectOrder(){
  if(_lectureSubjOrderCache) return _lectureSubjOrderCache;
  _lectureSubjOrderCache = []; _lectureSubjColorCache = {};
  // 실제 데이터 키가 축약형('통교','총창')일 수 있으므로 정식명과 축약형 모두 등록한다.
  const ABBR_OF = {}; // 정식명 -> 축약형
  Object.keys(SUB_DISPLAY_IDX).forEach(abbr=>{ ABBR_OF[SUB_DISPLAY_IDX[abbr]] = abbr; });
  SUBJECT_META.forEach(s=>{
    _lectureSubjOrderCache.push(s.name);
    _lectureSubjColorCache[s.name] = s.color;
    if(ABBR_OF[s.name]){
      _lectureSubjOrderCache.push(ABBR_OF[s.name]);
      _lectureSubjColorCache[ABBR_OF[s.name]] = s.color;
    }
    (LECTURE_COMPANIONS[s.name]||[]).forEach(c=>{
      _lectureSubjOrderCache.push(c);
      _lectureSubjColorCache[c] = s.color;
    });
  });
  return _lectureSubjOrderCache;

const _chartResizeObservers = {};
function observeChartResize(wrapId, getChart){

// ---- exam name parsing: base 이름 + 회차 분리 ----
function parseExamEntry(raw){
  const name = raw.trim();
  let m = name.match(/^(.*?)(\d+)~(\d+)\?*회$/);
  if(m){ const rounds=[]; for(let i=+m[2];i<=+m[3];i++) rounds.push(i+'회'); return {base:m[1].trim(), rounds}; }
  m = name.match(/^(.*?)([\d,]+)월$/);
  if(m && m[2].includes(',')) return {base:m[1].trim(), rounds:m[2].split(',').map(n=>n.trim()+'월')};
  m = name.match(/^(.*?)([\d,]+)회$/);
  if(m && m[2].includes(',')) return {base:m[1].trim(), rounds:m[2].split(',').map(n=>n.trim()+'회')};
  // 회차가 하나뿐이어도(예: "임고온 1회") 이름과 회차를 분리
  m = name.match(/^(.+?)\s*(\d+회)$/);
  if(m && m[1].trim()) return {base:m[1].trim(), rounds:[m[2]]};
  m = name.match(/^(.+?)\s*(\d+월)$/);
  if(m && m[1].trim()) return {base:m[1].trim(), rounds:[m[2]]};
  return {base:name, rounds:['']};
}
function examTree(){
  const map = {};
  (S.exams||[]).forEach(e=>{
    if(e.status==='현황') return;
    const {base, rounds} = parseExamEntry(e.name);
    if(!map[base]) map[base]=new Set();
    rounds.forEach(r=>map[base].add(r));
  });
  return Object.keys(map).map(b=>({base:b, rounds:[...map[b]]}));
}
function fullExamName(base, round){ return round ? (base+' '+round) : base; }
function splitExamLabel(examName){
  const tree = examTree();
  for(const t of tree){
    if(examName===t.base) return { title:t.base, round:'' };
    if(examName.startsWith(t.base+' ')) return { title:t.base, round:examName.slice(t.base.length+1) };
  }
  return { title:examName, round:'' };
}

function renderExamRecordTable(){
  const wrap = document.getElementById('exam-record-table-wrap');
  if (!wrap) return;
  const rows = dedupeLatest(personScores(), r=>r.author+'|'+r.examName+'|'+r.type+'|'+r.subject);
  const subjType = {}; SUBJECT_META.forEach(s=>{ subjType[s.name]=s.type; });
  const byExam = {};
  // 같은 날짜 안에서는 기록된 순서(시트 입력 순서/타임스탬프)로 최신 여부를 가른다
  const recSeq = {};
  personScores().forEach((r,i)=>{
    const ts = Date.parse(r.timestamp||r.createdAt||r.recordedAt||'');
    recSeq[r.examName] = isNaN(ts) ? i : ts;
  });
  rows.forEach(r=>{
    if(!byExam[r.examName]) byExam[r.examName] = { date:r.examDate, subj:{}, total:0, a:0, b:0, aN:0, bN:0 };
    byExam[r.examName].subj[r.subject] = Number(r.score);
    byExam[r.examName].total += Number(r.score)||0;
    if(subjType[r.subject]==='A'){ byExam[r.examName].a += Number(r.score)||0; byExam[r.examName].aN++; }
    else if(subjType[r.subject]==='B'){ byExam[r.examName].b += Number(r.score)||0; byExam[r.examName].bN++; }
  });
  const examNames = Object.keys(byExam).sort((a,b)=>{
    const d = new Date(byExam[a].date) - new Date(byExam[b].date);
    const base = d!==0 && !isNaN(d) ? d : ((recSeq[a]||0) - (recSeq[b]||0));
    return examOrder==='desc' ? -base : base;
  });
  if (!examNames.length) {
    wrap.innerHTML = '<div style="color:var(--text3);font-size:13px;padding:16px 8px">기록된 모의고사가 없습니다. 우측 상단 + 기록 버튼으로 추가하세요.</div>';
    return;
  }
  // 회차별 A/B 응시자 평균 -> 총점 평균(A+B) 계산
  const avgByExam = {};
  (examData.averages||[]).forEach(a=>{
    if(!avgByExam[a.examName]) avgByExam[a.examName] = {A:null,B:null,total:null};
    avgByExam[a.examName][a.type] = Number(a.averageScore||0);
  });
  function avgOf(examName, key){
    const rec = avgByExam[examName];
    if(!rec) return null;
    if(key==='A') return rec.A;
    if(key==='B') return rec.B;
    if(rec.total!==null && rec.total!==undefined) return rec.total; // 총점 평균만 공개된 경우
    if(rec.A===null || rec.B===null) return null;
    return rec.A+rec.B;
  }
  function diffTag(val, avg){
    if(avg===null || avg===undefined) return '';
    const d = Math.round((val-avg)*10)/10;
    const c = d>=0 ? 'var(--blue)' : 'var(--red)';
    const sign = d>=0 ? '+' : '-';
    return `\u2009<span style="color:${c};font-size:10px">(${sign}${Math.abs(d)})</span>`;
  }
  const subjCols = SUBJECT_META;
  const divider = 'border-left:1px solid var(--border2)';
  const goals = personGoals();
  const FAIL = ';background:rgba(255,90,90,.22)';
  const needA = SUBJECT_META.filter(x=>x.type==='A').length, needB = SUBJECT_META.filter(x=>x.type==='B').length;
  const isRate = examModes.record==='rate';
  function rateOf(v, max){ return v===undefined||v===null ? undefined : Math.round(v/max*1000)/10; }
  function cellVal(v, max){
    if(v===undefined || v===null) return '-';
    return isRate ? rateOf(v,max).toFixed(1)+'%' : v;
  }
  // 과목 구분선: 첫 과목(국어) 앞, A형→B형이 바뀌는 지점(실과|수학) 앞
  const subjDivider = i => (i===0 || subjCols[i].type!==subjCols[i-1].type) ? divider : '';
  const hdr = (label, sub, color, extra)=> `<th style="color:${color}${extra?';'+extra:''}"><span style="display:block;line-height:1.2">${label}</span><span style="display:block;font-size:9px;font-weight:400;opacity:.7;line-height:1.2;margin-top:1px">${sub}</span></th>`;
  let html = '<table class="exam-score-table"><thead><tr><th style="text-align:left">회차</th><th style="' + divider + '">날짜</th>';
  html += hdr('총점', isRate?'정답률':'80점', 'var(--purple)', divider);
  html += hdr('A형', isRate?'정답률':'39점', SERIES_COLOR.A);
  html += hdr('B형', isRate?'정답률':'41점', SERIES_COLOR.B);
  subjCols.forEach((s,i)=>{ html += hdr(s.name, isRate?'정답률':s.max+'점', s.color, subjDivider(i)); });
  html += '</tr></thead><tbody>';
  examNames.forEach(n=>{
    const e = byExam[n];
    html += `<tr><td class="exam-score-name">${n}</td><td style="${divider}">${mmdd(e.date)}</td>`;
    const aAvg = avgOf(n,'A'), bAvg = avgOf(n,'B'), tAvg = avgOf(n,'total');
    // 해당 형(A/B)의 과목이 모두 기록된 경우에만 목표와 비교 (비어 있는 값은 무시)
    const aFull = e.aN >= needA, bFull = e.bN >= needB;
    const tF = (aFull && bFull && belowGoal(e.total, goals.total)) ? FAIL : '';
    const aF = (aFull && belowGoal(e.a, goals.A)) ? FAIL : '';
    const bF = (bFull && belowGoal(e.b, goals.B)) ? FAIL : '';
    if(isRate){
      html += `<td style="${divider};color:var(--text)${tF}">${rateOf(e.total,80).toFixed(1)}%</td><td style="color:var(--text)${aF}">${rateOf(e.a,39).toFixed(1)}%</td><td style="color:var(--text)${bF}">${rateOf(e.b,41).toFixed(1)}%</td>`;
    } else {
      html += `<td style="${divider};color:var(--text)${tF}">${e.total}${diffTag(e.total,tAvg)}</td><td style="color:var(--text)${aF}">${e.a}${diffTag(e.a,aAvg)}</td><td style="color:var(--text)${bF}">${e.b}${diffTag(e.b,bAvg)}</td>`;
    }
    subjCols.forEach((sj,i)=>{
      const d = subjDivider(i);
      const v = e.subj[sj.name];
      const f = (v!==undefined && v!==null && belowGoal(v, goals.subj[sj.name])) ? FAIL : '';
      const st = d + f;
      html += `<td${st?` style="${st}"`:''}>${cellVal(v, sj.max)}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;
}
function buildExamControls(){
  const seriesEl = document.getElementById('seriesTabs');
  seriesEl.innerHTML = ['total','A','B'].map(s=>{
    const label = s==='total'?'총점 80점':s==='A'?'A형 39점':'B형 41점';
    const on = examSeriesActive.has(s);
    return `<button class="stab${on?' on':''}" style="${on?`border-color:${SERIES_COLOR[s]};color:${SERIES_COLOR[s]};background:${SERIES_COLOR[s]}1a`:''}" onclick="toggleExamSeries('${s}',this)">${label}</button>`;
  }).join('');
  const orderEl = document.getElementById('orderTabs');
  if(orderEl){
    orderEl.innerHTML = ['desc','asc'].map(o=>{
      const label = o==='desc'?'최신순':'오래된순';
      const on = examOrder===o;
      return `<button class="stab${on?' on':''}" style="${on?'border-color:var(--accent);color:var(--accent);background:var(--accent3)':''}" onclick="setExamOrder('${o}')">${label}</button>`;
    }).join('');
  }
  [['record','recModeTabs'],['trend','trendModeTabs'],['subject','subjModeTabs'],['avg','avgModeTabs']].forEach(([key,id])=>{
    const el = document.getElementById(id);
    if(!el) return;
    el.innerHTML = ['score','rate'].map(m=>{
      const label = m==='score'?'점수':'정답률';
      const on = examModes[key]===m;
      return `<button class="stab${on?' on':''}" style="${on?'border-color:var(--accent);color:var(--accent);background:var(--accent3)':''}" onclick="setExamMode('${key}','${m}')">${label}</button>`;
    }).join('');
  });
  const trendAll = document.getElementById('trendAllBtn');
  if(trendAll){
    const allOn = examSeriesActive.size===3 && examAvgActive.size===3;
    trendAll.textContent = allOn ? '모두 해제' : '모두 선택';
  }
  const avgEl = document.getElementById('avgTabs');
  avgEl.innerHTML = ['total','A','B'].map(s=>{
    const label = s==='total'?'총점 평균':s==='A'?'A형 평균':'B형 평균';
    const on = examAvgActive.has(s);
    const c = SERIES_COLOR[s];
    return `<button class="stab${on?' on':''}" style="${on?`border-color:${c};color:${examThemeTextColor()};background:${c}1a`:''}" onclick="toggleExamAvg('${s}',this)">${label}</button>`;
  }).join('');
}
function setExamOrder(o){
  examOrder = o;
  buildExamControls();
  renderExamRecordTable();
}
function toggleExamAvg(s,btn){
  if(examAvgActive.has(s)) examAvgActive.delete(s); else examAvgActive.add(s);
  buildExamControls();
  renderExamTrend();
}
function syncSubjectsWithSeries(){
  const types = new Set();
  examSeriesActive.forEach(s=>{ if(s==='total'){ types.add('A'); types.add('B'); } else types.add(s); });
  if(types.size===0) return;
  activeSubjects = new Set(SUBJECT_META.filter(x=>types.has(x.type)).map(x=>x.name));
}
function toggleExamSeries(s,btn){
  const turningOn = !examSeriesActive.has(s);
  if(turningOn) examSeriesActive.add(s); else examSeriesActive.delete(s);
  syncSubjectsWithSeries();
  buildExamControls();
  renderExamSubjectTabs();
  renderExamTrend();
}
function setExamMode(key,m){
  examModes[key]=m;
  buildExamControls();
  if(key==='record') renderExamRecordTable();
  else if(key==='trend') renderExamTrend();
  else if(key==='subject') renderExamSubjectChart();
  else if(key==='avg') renderAvgRateChart();
}
// 회차별 추이: 총점/A형/B형 + 총점·A형·B형 평균 6개 토글 전체 선택/해제
function toggleAllTrend(){
  const allOn = examSeriesActive.size===3 && examAvgActive.size===3;
  if(allOn){ examSeriesActive = new Set(); examAvgActive = new Set(); }
  else { examSeriesActive = new Set(['total','A','B']); examAvgActive = new Set(['total','A','B']); }
  syncSubjectsWithSeries();
  buildExamControls();
  renderExamSubjectTabs();
  renderExamTrend();
}

// 시트에서 오는 날짜(ISO/Date 문자열)를 <input type=date>가 받는 yyyy-mm-dd(로컬)로 변환
function toDateInput(v){
  if(!v) return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  const d = new Date(v);
  if(isNaN(d)) return '';
  const z = n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
}
// X축: 회차가 많아도 전부 표시. 값 라벨과 같은 8px, 많으면 세로로 눕혀서 한 줄로 표시
function xTickOptions(n){
  const many = n>5;
  return {
    color: (c)=> (c.chart && c.chart.$selIdx===c.index) ? selAccent() : examThemeTextColor(), autoSkip:false, font:{ size:8 },
    maxRotation: many?90:0, minRotation: many?90:0,
    callback: function(val){
      const l = this.getLabelForValue(val);
      return (many && Array.isArray(l)) ? l.join(' ') : l;
    }
  };
}

function personScores(){ return examData.scores.filter(r=>r.author===examPerson); }

function mmdd(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr);
  if(isNaN(d)) return dateStr;
  return (d.getMonth()+1)+'/'+d.getDate();
}
function multiLineLabel(examName, dateStr){
  const { title, round } = splitExamLabel(examName);
  const lines = [mmdd(dateStr)];
  title.split(' ').forEach(w=>lines.push(w));
  if(round) lines.push(round);
  return lines;
}
function fmtVal(v, mode){
  if(v===null || v===undefined) return '';
  return mode==='rate' ? (Math.round(v*10)/10).toFixed(1)+'%' : Math.round(v)+'점';
}
function fmtBoth(rawScore, max){
  if(rawScore===null || rawScore===undefined || !max) return '';
  const rate = Math.round(rawScore/max*1000)/10;
  return (Math.round(rawScore*10)/10)+'점 / '+max+'점 ('+rate.toFixed(1)+'%)';
}

// 점 위에 값 라벨을 직접 그려주는 경량 플러그인 (외부 CDN 의존 없이 처리)
const valueLabelPlugin = {
  id:'valueLabelPlugin',
  afterDatasetsDraw(chart){
    const ctx = chart.ctx;
    chart.data.datasets.forEach((ds,di)=>{
      if(ds.hideLabel) return;
      const meta = chart.getDatasetMeta(di);
      if(meta.hidden) return;
      meta.data.forEach((point,i)=>{
        const v = ds.data[i];
        if(v===null || v===undefined) return;
        ctx.save();
        ctx.font = '8px sans-serif';
        ctx.fillStyle = ds.isAvgDataset ? examThemeTextColor() : (ds.borderColor || '#888');
        ctx.textAlign = 'center';
        ctx.fillText(fmtVal(v, ds.valueMode), point.x, point.y - 8);
        ctx.restore();
      });
    });
  }
};

// ===== 슬라이더로 회차/과목 선택 → 회색 선 + 툴팁 =====
// 그래프 아래 슬라이더를 움직이면 가장 가까운 회차(과목)에 회색 선이 붙고 툴팁이 뜬다.
// 처음에는 아무것도 선택되지 않은 상태(툴팁 없음). 선택된 손잡이를 탭하면 선택 해제.
const SEL_LINE_COLOR = 'rgba(150,150,150,.75)';
function selAccent(){ return (getComputedStyle(document.body).getPropertyValue('--accent')||'').trim() || '#c8f060'; }
function sliderIdxFrac(chart, idx){
  const a = chart.chartArea, xs = chart.scales.x, w = a.right - a.left;
  return w>0 ? (xs.getPixelForValue(idx) - a.left)/w : 0;
}
function sliderFracIdx(chart, frac){
  const a = chart.chartArea, xs = chart.scales.x;
  const x = a.left + frac*(a.right - a.left);
  const n = (chart.data.labels||[]).length;
  let idx = -1, best = Infinity;
  for(let i=0;i<n;i++){
    const d = Math.abs(xs.getPixelForValue(i) - x);
    if(d < best){ best = d; idx = i; }
  }
  return idx;
}
// 슬라이더 트랙을 차트의 그래프 영역(좌우 폭)에 맞춰 배치하고 손잡이 위치를 갱신
function layoutSlider(chart, id){
  const root = document.getElementById(id);
  if(!root || !chart.chartArea) return;
  const track = root.querySelector('.ss-track'), thumb = root.querySelector('.ss-thumb');
  const a = chart.chartArea, w = a.right - a.left;
  track.style.left = a.left+'px'; track.style.width = w+'px';
  const idx = chart.$selIdx;
  if(idx===null || idx===undefined){
    thumb.classList.add('idle'); thumb.style.left = '0px';
  } else {
    thumb.classList.remove('idle');
    const f = (chart.$dragFrac!==null && chart.$dragFrac!==undefined) ? chart.$dragFrac : sliderIdxFrac(chart, idx);
    thumb.style.left = (f*w)+'px';
  }
}
function makeSelPlugin(id){
  return {
    id:'selSlider',
    afterLayout(chart){ layoutSlider(chart, id); },
    beforeDatasetsDraw(chart){
      const idx = chart.$selIdx;
      if(idx===null || idx===undefined) return;
      const a = chart.chartArea, x = chart.scales.x.getPixelForValue(idx);
      const ctx = chart.ctx;
      ctx.save(); ctx.strokeStyle = SEL_LINE_COLOR; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(x, a.top); ctx.lineTo(x, chart.height); ctx.stroke(); ctx.restore();
    }
  };
}
// 꺾은선: 해당 회차에 값이 있는 (표시 중인) 모든 데이터셋의 점
function lineActive(c, idx){
  return c.data.datasets.map((ds,di)=>({datasetIndex:di, index:idx})).filter(a=>{
    if(c.getDatasetMeta(a.datasetIndex).hidden) return false;
    const v = c.data.datasets[a.datasetIndex].data[idx];
    return v!==null && v!==undefined;
  });
}
// 막대: 해당 과목 막대 (기록 없음도 툴팁 표시)
function barActive(c, idx){ return [{datasetIndex:0, index:idx}]; }

function attachSlider(chart, id, getActive){
  const root = document.getElementById(id);
  if(!root) return;
  chart.$selIdx = null; chart.$dragFrac = null;
  layoutSlider(chart, id);
  const track = root.querySelector('.ss-track');
  function show(idx){
    const none = ()=>{ chart.$selIdx = null; chart.tooltip.setActiveElements([], {x:0,y:0}); chart.setActiveElements([]); };
    if(idx===null || idx<0){ none(); }
    else {
      chart.$selIdx = idx;
      const active = getActive(chart, idx);
      if(active.length){
        const pt = chart.getDatasetMeta(active[0].datasetIndex).data[idx];
        chart.tooltip.setActiveElements(active, pt ? {x:pt.x, y:pt.y} : {x:0,y:0});
        chart.setActiveElements(active);
      } else {
        chart.tooltip.setActiveElements([], {x:0,y:0}); chart.setActiveElements([]);
      }
    }
    chart.update();
  }
  let dragging = false, moved = false, startX = 0, onThumb = false, last = null;
  const fracOf = (e)=>{
    const r = track.getBoundingClientRect();
    return r.width>0 ? Math.min(1, Math.max(0, (e.clientX - r.left)/r.width)) : 0;
  };
  root.onpointerdown = (e)=>{
    if(!chart.chartArea) return;
    dragging = true; moved = false; startX = e.clientX;
    onThumb = chart.$selIdx!==null && !!(e.target.closest && e.target.closest('.ss-thumb'));
    try{ root.setPointerCapture(e.pointerId); }catch(_){}
    if(onThumb){ last = chart.$selIdx; return; }
    const f = fracOf(e); chart.$dragFrac = f;
    last = sliderFracIdx(chart, f); show(last);
  };
  root.onpointermove = (e)=>{
    if(!dragging) return;
    if(!moved && Math.abs(e.clientX - startX) > 4) moved = true;
    if(onThumb && !moved) return;
    const f = fracOf(e); chart.$dragFrac = f;
    const i = sliderFracIdx(chart, f);
    if(i !== last){ last = i; show(i); } else layoutSlider(chart, id);
  };
  const end = ()=>{
    if(!dragging) return;
    dragging = false;
    chart.$dragFrac = null;
    if(onThumb && !moved){ show(null); return; } // 손잡이를 그냥 탭하면 선택 해제
    layoutSlider(chart, id); // 가장 가까운 회차 위치로 손잡이 정렬
  };
  root.onpointerup = end;
  root.onpointercancel = end;
}


function examTrendPoints(seriesKey){
  const rows = dedupeLatest(personScores().filter(r=> seriesKey==='total' || r.type===seriesKey),
    r=>r.author+'|'+r.examName+'|'+r.type+'|'+r.subject);
  const byExam = {};
  rows.forEach(r=>{
    if(!byExam[r.examName]) byExam[r.examName] = { score:0, date:r.examDate, count:0 };
    byExam[r.examName].score += Number(r.score)||0;
    byExam[r.examName].count++;
  });
  return byExam;
}
function allExamLabelsForActiveSeries(){
  const set = new Set();
  [...examSeriesActive].forEach(s=>{ Object.keys(examTrendPoints(s)).forEach(n=>set.add(n)); });
  examAvgActive.forEach(s=>{
    examData.averages.forEach(a=>{ if(s==='total' || a.type===s) set.add(a.examName); });
  });
  return [...set].sort((a,b)=>{
    const da = examData.scores.find(r=>r.examName===a)?.examDate || examData.averages.find(r=>r.examName===a)?.examDate;
    const db = examData.scores.find(r=>r.examName===b)?.examDate || examData.averages.find(r=>r.examName===b)?.examDate;
    return new Date(da) - new Date(db);
  });
}
function seriesMax(s){ return s==='total'?80:s==='A'?39:41; }

function renderExamTrend(){
  const trendGoals = personGoals();
  const labelsRaw = allExamLabelsForActiveSeries();
  const dateOf = {};
  examData.scores.forEach(r=>{ dateOf[r.examName]=r.examDate; });
  examData.averages.forEach(a=>{ if(!dateOf[a.examName]) dateOf[a.examName]=a.examDate; });
  const labels = labelsRaw.map(n=>multiLineLabel(n, dateOf[n]));

  // 회차별 재언이 기록한 A/B 평균 (총점 평균 = A형 평균+B형 평균)
  const avgByExam = {};
  examData.averages.forEach(a=>{
    if(!avgByExam[a.examName]) avgByExam[a.examName] = {A:null,B:null,total:null};
    avgByExam[a.examName][a.type] = Number(a.averageScore||0);
  });
  function avgFor(n, seriesKey){
    const rec = avgByExam[n];
    if(!rec) return null;
    if(seriesKey==='A') return rec.A;
    if(seriesKey==='B') return rec.B;
    if(rec.total!==null && rec.total!==undefined) return rec.total;
    if(rec.A===null || rec.B===null) return null;
    return rec.A+rec.B;
  }
  const avgLabelOf = { total:'총점 평균', A:'A형 평균', B:'B형 평균' };

  const datasets = [...examSeriesActive].map(s=>{
    const pts = examTrendPoints(s);
    const max = seriesMax(s);
    const rawScores = labelsRaw.map(n=> pts[n] ? pts[n].score : null);
    const data = rawScores.map(v=> v===null?null: (examModes.trend==='score' ? v : Math.round(v/max*1000)/10));
    const avgRaw = labelsRaw.map(n=>avgFor(n,s));
    const need = SUBJECT_META.filter(x=> s==='total' || x.type===s).length;
    const complete = labelsRaw.map(n=> !!(pts[n] && pts[n].count>=need)); // 과목이 모두 기록된 회차만 목표 비교
    return {
      seriesKey:s, complete,
      label: s==='total'?'총점':s==='A'?'A형':'B형',
      data, rawScores, maxScore:max, avgRaw, valueMode:examModes.trend,
      borderColor: SERIES_COLOR[s], backgroundColor: SERIES_COLOR[s],
      tension:.2, pointRadius:4, pointHitRadius:10, spanGaps:true
    };
  });

  // 사용자가 직접 켠 평균만 흰색 점(선 없음)으로 표시
  [...examAvgActive].forEach(s=>{
    const max = seriesMax(s);
    const rawScores = labelsRaw.map(n=>avgFor(n,s));
    const data = rawScores.map(v=> v===null?null: (examModes.trend==='score'? v : Math.round(v/max*1000)/10));
    datasets.push({
      seriesKey:s, isAvgDataset:true, label: avgLabelOf[s], valueMode:examModes.trend,
      data, rawScores, maxScore:max,
      showLine:false, pointBackgroundColor:'transparent', pointBorderColor:SERIES_COLOR[s], pointBorderWidth:2, pointRadius:5, pointHitRadius:10, pointStyle:'circle',
      borderColor:SERIES_COLOR[s]
    });
  });

  const ctx = document.getElementById('examTrendChart');
  if(examTrendChart) examTrendChart.destroy();
  const activeTypes = new Set([...examSeriesActive, ...examAvgActive]);
  const yMax = examModes.trend==='rate' ? 100 : (activeTypes.size ? Math.max(...[...activeTypes].map(seriesMax)) : undefined);
  examTrendChart = new Chart(ctx, {
    type:'line',
    data:{ labels, datasets },
    plugins:[valueLabelPlugin, makeSelPlugin('examTrendSlider')],
    options:{ responsive:true, maintainAspectRatio:false, events:[], interaction:{ mode:'nearest', intersect:false, axis:'x' },
      layout:{ padding:{ top:24 } },
      plugins:{ legend:{display:false},
        tooltip:{ callbacks:{
          title:(items)=> labelsRaw[items[0].dataIndex],
          label:(c)=>{
            const ds = c.dataset;
            const i = c.dataIndex;
            return ds.label+': '+fmtBoth(ds.rawScores[i], ds.maxScore);
          },
          labelTextColor:(c)=>{
            const ds = c.dataset;
            const g = ds.isAvgDataset ? null : trendGoals[ds.seriesKey];
            return (ds.complete && ds.complete[c.dataIndex] && belowGoal(ds.rawScores[c.dataIndex], g)) ? GOAL_FAIL_TIP_COLOR : '#ffffff';
          }
        } } },
      scales:{ y:{ beginAtZero:true, max:yMax }, x:{ grid:{display:false}, ticks:xTickOptions(labels.length) } } }
  });
  attachSlider(examTrendChart,'examTrendSlider',lineActive);
  observeChartResize('examTrendChartWrap', ()=>examTrendChart);
}

function renderExamSubjectChart(){

    return { label:s.name, valueMode:examModes.subject, data, rawScores, maxScore:s.max, borderColor:s.color, backgroundColor:s.color, tension:.2, pointRadius:4, pointHitRadius:10, spanGaps:true };
  });

  const yTicks = examModes.subject==='rate' ? {} : { stepSize:1, precision:0, autoSkip:false };
  examSubjectChart = new Chart(ctx,{
    type:'line',
    data:{ labels, datasets },
    plugins:[valueLabelPlugin, makeSelPlugin('examSubjectSlider')],
    options:{ responsive:true, maintainAspectRatio:false, events:[], interaction:{ mode:'nearest', intersect:false, axis:'x' },
      layout:{ padding:{ top:24 } },
      plugins:{ legend:{display:false},
        tooltip:{ callbacks:{
          title:(items)=> examNames[items[0].dataIndex],
          label:(c)=> c.dataset.label+': '+fmtBoth(c.dataset.rawScores[c.dataIndex], c.dataset.maxScore),
          labelTextColor:(c)=>{
            const raw = c.dataset.rawScores[c.dataIndex], max = c.dataset.maxScore;
            const f = raw!==null && raw!==undefined && belowGoal(raw, subjGoals.subj[c.dataset.label]);
            return f ? GOAL_FAIL_TIP_COLOR : '#ffffff';
          }
        } } },
      scales:{ y:{ beginAtZero:true, max: subjYMax, ticks:yTicks,
        afterBuildTicks: (axis)=>{
          if(examModes.subject==='rate' || subjYMax==null) return;
          const step = subjYMax<=12 ? 1 : Math.ceil(subjYMax/10);
          const ticks = [];
          for(let v=0; v<subjYMax; v+=step) ticks.push({value:v});
          ticks.push({value:subjYMax});
          axis.ticks = ticks;
        }
      }, x:{ grid:{display:false}, ticks:xTickOptions(labels.length) } } }
  });

// ---- 평균 (막대그래프, 점수/정답률 토글 반영) ----
let avgRateChart = null;
function renderAvgRateChart(){
  const rows = dedupeLatest(personScores(), r=>r.author+'|'+r.examName+'|'+r.type+'|'+r.subject);
  const isRate = examModes.avg==='rate';
  function typeAvg(type,max){
    const byExam = {};
    rows.filter(r=>r.type===type).forEach(r=>{ byExam[r.examName]=(byExam[r.examName]||0)+Number(r.score); });
    const exams = Object.values(byExam);
    if(!exams.length) return null;
    const avg = exams.reduce((a,b)=>a+b,0)/exams.length;
    return avg;
  }
  function totalAvg(){
    const byExam = {};
    rows.forEach(r=>{ byExam[r.examName]=(byExam[r.examName]||0)+Number(r.score); });
    const exams = Object.values(byExam);
    if(!exams.length) return null;
    const avg = exams.reduce((a,b)=>a+b,0)/exams.length;
    return avg;
  }
  const subjAvgs = SUBJECT_META.map(s=>{
    const rs = rows.filter(r=>r.subject===s.name);
    if(!rs.length) return null;
    const avg = rs.reduce((a,r)=>a+Number(r.score),0)/rs.length;
    return avg;
  });
  const maxScores = [80, 39, 41, ...SUBJECT_META.map(s=>s.max)];
  const labels = ['총점','A형','B형', ...SUBJECT_META.map(s=>s.name)];
  // rawAvgs: 점수 단위 평균(반올림 전). 막대 값은 모드에 따라 점수/정답률, 툴팁은 항상 점수+정답률
  const rawAvgs = [totalAvg(), typeAvg('A',39), typeAvg('B',41), ...subjAvgs];
  // 목표 점수 (총점, A형, B형, 과목들 순서). 표시되는 소수 첫째 자리 평균 기준으로 비교
  const avgGoals = personGoals();
  const goalList = [avgGoals.total, avgGoals.A, avgGoals.B, ...SUBJECT_META.map(sj=>avgGoals.subj[sj.name])];
  const data = rawAvgs.map((v,i)=> v===null ? null : (isRate ? Math.round(v/maxScores[i]*1000)/10 : Math.round(v*10)/10));
  const themeCol = examThemeTextColor();
  const bgColors = [themeCol, themeCol, themeCol, ...SUBJECT_META.map(s=>s.color)];
  const tickColors = [themeCol, themeCol, themeCol, ...SUBJECT_META.map(s=>s.color)];

  const ctx = document.getElementById('avgRateChart');
  if(avgRateChart) avgRateChart.destroy();
  const barOpts = { barPercentage:0.55, categoryPercentage:0.7 };
  const barDatasetIndex = 0;
  const datasets = [
    { data, backgroundColor:bgColors, borderRadius:4, borderWidth:0,
      rawScores:data, maxScores, unitLabel: isRate?'%':'점', label:'평균', ...barOpts }
  ];
  avgRateChart = new Chart(ctx, {
    type:'bar',
    data:{ labels, datasets },
    plugins:[valueLabelBarPlugin, makeSelPlugin('avgRateSlider')],
    options:{ responsive:true, maintainAspectRatio:false, events:[],
      layout:{ padding:{ top:24 } },
      plugins:{ legend:{display:false},
        tooltip:{ callbacks:{
          title:(items)=> items && items[0] ? items[0].label : '',
          label:(c)=>{
            const max = maxScores[c.dataIndex];
            const raw = rawAvgs[c.dataIndex];
            if(raw===null || raw===undefined) return '기록 없음';
            const avgVal = Math.round(raw*10)/10;
            const rate = max ? Math.round(raw/max*1000)/10 : 0;
            return [ `평균 : ${avgVal}점 (${rate}%)`, `만점 : ${max}점` ];
          },
          labelTextColor:(c)=>{
            const raw = rawAvgs[c.dataIndex];
            if(raw===null || raw===undefined) return '#ffffff';
            return belowGoal(Math.round(raw*10)/10, goalList[c.dataIndex]) ? GOAL_FAIL_TIP_COLOR : '#ffffff';
          }
        } } },
      scales:{ y:{ beginAtZero:true, max: isRate ? 100 : Math.max(...maxScores) }, x:{ grouped:false, grid:{display:false}, ticks:{ autoSkip:false, maxRotation:0, minRotation:0, font:{ size:8 }, color: (c)=>tickColors[c.index],
        callback:(val,idx)=> [labels[idx], maxScores[idx]+'점'] } } } }
  });
  attachSlider(avgRateChart,'avgRateSlider',barActive);
  observeChartResize('avgRateChartWrap', ()=>avgRateChart);
}
const valueLabelBarPlugin = {
  id:'valueLabelBarPlugin',
  afterDatasetsDraw(chart){
    const ctx = chart.ctx;
    chart.data.datasets.forEach((ds,di)=>{
      if(ds.skipLabel) return;
      const meta = chart.getDatasetMeta(di);
      const colorSrc = (ds.pointBorderColor && ds.pointBorderColor!=='transparent') ? ds.pointBorderColor : ds.backgroundColor;
      // 동그라미 마커는 반지름+테두리만큼 더 띄워서 값 라벨이 마커와 겹치지 않게 함
      const offset = ds.pointStyle ? (ds.pointRadius||5) + (ds.pointBorderWidth||2) + 6 : 6;
      meta.data.forEach((bar,i)=>{
        const v = ds.data[i];
        if(v===null || v===undefined) return;
        ctx.save();
        ctx.font = '8px sans-serif';
        ctx.fillStyle = Array.isArray(colorSrc) ? colorSrc[i] : (colorSrc||'#888');
        ctx.textAlign = 'center';
        ctx.fillText((ds.labelPrefix||'') + v + (ds.unitLabel || '%'), bar.x, bar.y - offset);
        ctx.restore();
      });
    });
  }
};

// ---- 목표 (Apps Script 'goals' 시트에 append, (author, goalKey)별 최신 값이 현재 목표) ----
const GOAL_FAIL_TIP_COLOR = '#ff8a8a'; // 어두운 툴팁 배경용 밝은 빨강
function personGoals(){
  const out = { total:null, A:null, B:null, subj:{} };
  const rows = dedupeLatest((examData.goals||[]).filter(g=>g.author===examPerson), g=>g.goalKey);
  rows.forEach(g=>{
    if(g.value==='' || g.value===null || g.value===undefined) return;
    const v = Number(g.value);
    if(isNaN(v)) return;
    if(g.goalKey==='total' || g.goalKey==='A' || g.goalKey==='B') out[g.goalKey] = v;
    else if(String(g.goalKey).indexOf('subjScore:')===0) out.subj[String(g.goalKey).slice(10)] = v;
  });
  return out;
}
// 목표와 같으면 달성, 목표보다 낮을 때만 true
function belowGoal(value, goal){
  if(value===null || value===undefined || goal===null || goal===undefined) return false;
  return value < goal - 1e-9;
}
function openGoalModal(){
  if(!examPerson) return;
  const g = personGoals();
  document.getElementById('goalModalTitle').textContent = examPerson+' 목표 설정';
  // 과목명/형(테마색) + 만점(기본 글자색) + 목표 입력란 + '점'(회색)
  const row = (label,color,maxPt,id,val)=>`<div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">
      <label style="width:78px;flex-shrink:0;font-size:13px;color:${color}">${label}</label>
      <span style="font-size:13px;color:var(--text);width:34px;flex-shrink:0">${maxPt}점</span>
      <input type="number" min="0" max="${maxPt}" step="any" id="${id}" value="${val===null||val===undefined?'':val}" style="flex:1;padding:4px 6px">
      <span style="font-size:11px;color:var(--text3);flex-shrink:0">점</span>
    </div>`;
  let html = '<div style="font-size:12px;color:var(--text2);margin:2px 0 6px">점수 목표</div>';
  html += row('총점','var(--purple)',80,'goal-total',g.total);
  html += row('A형',SERIES_COLOR.A,39,'goal-A',g.A);
  html += row('B형',SERIES_COLOR.B,41,'goal-B',g.B);
  // 구분선: B형과 국어 사이, 실과(A)와 수학(B) 사이
  const goalDivider = '<div style="border-top:1px solid var(--border2);margin:8px 0"></div>';
  SUBJECT_META.forEach((sj,i)=>{
    if(i===0 || sj.type!==SUBJECT_META[i-1].type) html += goalDivider;
    html += row(sj.name, sj.color, sj.max, 'goal-s-'+i, g.subj[sj.name]);

  document.getElementById('goal-fields').innerHTML = html;

  document.getElementById('goalModalBg').style.display='flex';
}
function closeGoalModal(){ document.getElementById('goalModalBg').style.display='none'; }
async function submitGoals(){
  const st = document.getElementById('goal-status');
  const cur = personGoals();
  const items = [];
  try{
    const consider = (key, id, prev, max, label)=>{
      const raw = document.getElementById(id).value.trim();
      let val = '';
      if(raw!==''){
        val = Number(raw);
        if(isNaN(val) || val<0 || val>max) throw new Error(label+' 목표는 0~'+max+' 사이로 입력해주세요.');
      }
      const prevVal = (prev===null || prev===undefined) ? '' : prev;
      if(val!==prevVal) items.push({ goalKey:key, value:val });
    };
    consider('total','goal-total',cur.total,80,'총점');
    consider('A','goal-A',cur.A,39,'A형');
    consider('B','goal-B',cur.B,41,'B형');
    SUBJECT_META.forEach((sj,i)=> consider('subjScore:'+sj.name,'goal-s-'+i,cur.subj[sj.name],sj.max,sj.name));
  }catch(err){ st.style.color=''; st.textContent = err.message; return; }
  if(!items.length){ closeGoalModal(); return; }
  st.style.color=''; st.textContent='저장 중...';
  try{
    const res = await fetch(MOCK_EXAM_API_URL,{ method:'POST', body:JSON.stringify({ target:'goals', author:examPerson, items })});

function buildRecordFields(){

function prefillRecordFields(){
  const examName = currentRecExamName();
  if(!examName) return;
  if(recordMode==='score'){
    const rows = dedupeLatest(personScores().filter(r=>r.examName===examName), r=>r.subject);
    prefillSnapshot = {};
    SUBJECT_META.forEach((s,i)=>{
      const el = document.getElementById('rec-score-'+i);
      if(!el) return;
      const row = rows.find(r=>r.subject===s.name);
      el.value = row ? row.score : '';
      prefillSnapshot[s.name] = row ? String(row.score) : '';
    });
    const lastAvg = t => examData.averages.filter(a=>a.examName===examName && a.type===t).slice(-1)[0];
    if(examPerson==='재언'){
      const avgA = lastAvg('A'), avgB = lastAvg('B'), avgT = lastAvg('total');
      document.getElementById('rec-avgScoreA').value = avgA ? avgA.averageScore : '';
      document.getElementById('rec-avgScoreB').value = avgB ? avgB.averageScore : '';
      document.getElementById('rec-avgScoreT').value = avgT ? avgT.averageScore : '';
    }
    // 기존 기록이 있으면 당시 날짜를 그대로 불러온다 (점수 기록이 없으면 평균 기록의 날짜)
    const scoreRows = personScores().filter(r=>r.examName===examName);
    const avgRow = examData.averages.filter(a=>a.examName===examName).slice(-1)[0];
    const savedDate = scoreRows.length ? scoreRows[scoreRows.length-1].examDate : (avgRow ? avgRow.examDate : '');
    document.getElementById('rec-examDate').value = toDateInput(savedDate) || new Date().toISOString().slice(0,10);
  } else {
    const rows = examData.wrongAnswers.filter(r=>r.author===examPerson && r.examName===examName);
    SUBJECT_META.forEach((s,i)=>{
      const el = document.getElementById('rec-wrong-'+i);
      if(!el) return;
      const row = rows.slice().reverse().find(r=>r.subject===s.name);
      el.value = row ? row.note : '';
    });
  }
}
async function submitRecord(){
  const statusEl = document.getElementById('record-status');
  const examName = currentRecExamName();
  const examDate = document.getElementById('rec-examDate').value;
  if(!examName || !examDate){ statusEl.textContent='회차와 날짜를 확인해주세요.'; return; }
  statusEl.textContent='저장 중...';
  try{
    if(recordMode==='score'){
      const itemsA = SUBJECT_META.filter(s=>s.type==='A').map((s,idx)=>{
        const i = SUBJECT_META.indexOf(s);
        return { subject:s.name, score:Number(document.getElementById('rec-score-'+i).value||0), maxScore:s.max };
      });
      const itemsB = SUBJECT_META.filter(s=>s.type==='B').map((s)=>{
        const i = SUBJECT_META.indexOf(s);
        return { subject:s.name, score:Number(document.getElementById('rec-score-'+i).value||0), maxScore:s.max };
      });
      // 점수 칸이 하나라도 입력돼 있고, 불러온 값에서 바뀐 경우에만 점수를 저장한다
      // (평균만 추가/수정할 때 점수 행이 중복·0점으로 쌓이지 않도록)
      const curScores = {}; SUBJECT_META.forEach((s,i)=>{ curScores[s.name] = document.getElementById('rec-score-'+i).value; });
      const anyScore = Object.values(curScores).some(v=>v!=='');
      const scoreChanged = !prefillSnapshot || Object.keys(curScores).some(k=>String(curScores[k])!==String(prefillSnapshot[k]??''));
      const prevDate = (()=>{ const r = personScores().filter(r=>r.examName===examName).slice(-1)[0]; return r ? toDateInput(r.examDate) : ''; })();
      if(anyScore && (scoreChanged || (prevDate && prevDate!==examDate))){
        await fetch(MOCK_EXAM_API_URL,{ method:'POST', body:JSON.stringify({ target:'scores', author:examPerson, examName, type:'A', examDate, items:itemsA })});
        await fetch(MOCK_EXAM_API_URL,{ method:'POST', body:JSON.stringify({ target:'scores', author:examPerson, examName, type:'B', examDate, items:itemsB })});
      }
      if(examPerson==='재언'){
        const avgValA = document.getElementById('rec-avgScoreA').value;
        const avgValB = document.getElementById('rec-avgScoreB').value;
        const avgValT = document.getElementById('rec-avgScoreT').value;
        const lastAvg = t => examData.averages.filter(a=>a.examName===examName && a.type===t).slice(-1)[0];
        // 값이 바뀐 평균만 전송 (A/B만, 총점만, 셋 다 모두 가능)
        const sendAvg = async (type,val)=>{
          if(val==='' || val===null) return;
          const prev = lastAvg(type);
          if(prev && Number(prev.averageScore)===Number(val)) return;
          await fetch(MOCK_EXAM_API_URL,{ method:'POST', body:JSON.stringify({ target:'averages', examName, type, examDate, averageScore:Number(val) })});
        };
        await sendAvg('A', avgValA);
        await sendAvg('B', avgValB);
        await sendAvg('total', avgValT);
      }
    } else {
      const itemsA = SUBJECT_META.filter(s=>s.type==='A').map((s)=>{
        const i = SUBJECT_META.indexOf(s);
        return { subject:s.name, note:document.getElementById('rec-wrong-'+i).value };
      }).filter(it=>it.note && it.note.trim());
      const itemsB = SUBJECT_META.filter(s=>s.type==='B').map((s)=>{
        const i = SUBJECT_META.indexOf(s);
        return { subject:s.name, note:document.getElementById('rec-wrong-'+i).value };
      }).filter(it=>it.note && it.note.trim());
      if(itemsA.length) await fetch(MOCK_EXAM_API_URL,{ method:'POST', body:JSON.stringify({ target:'wrongAnswers', author:examPerson, examName, type:'A', examDate, items:itemsA })});
      if(itemsB.length) await fetch(MOCK_EXAM_API_URL,{ method:'POST', body:JSON.stringify({ target:'wrongAnswers', author:examPerson, examName, type:'B', examDate, items:itemsB })});
    }
    await fetchExamData();
    renderExamRecordTable();
    renderExamTrend(); renderExamSubjectTabs(); renderAvgRateChart(); buildWrongExamSelects(); renderWrongList();
    statusEl.textContent='저장 완료!';
    statusEl.style.color = 'var(--accent)';
    setTimeout(()=>{
      closeRecordModal();
      statusEl.style.color = '';
    }, 700);
  }catch(e){
    statusEl.textContent='저장 실패: '+e;
  }
}

const BB={D:'imgo_bb_docs',R:'imgo_bb_rec_',P:'imgo_bb_person',S:'imgo_bb_set_',N:'imgo_bb_done_'};

let bbSes=[],bbEC=null,bbRuns={},bbDocs=[],bbPerson='재언',bbRec={},bbSet={min:60,max:80,term:1},bbDone={},bbView=null,bbS=null,bbTmp=null;
let bbTab='weekly',bbSub='all',bbSort='abc',bbAS='all',bbDay=null,bbF={subj:'',loc:'',days:[],edit:null};
const bbEsc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const bbCol=r=>r===null?'var(--text3)':r>=bbSet.max?'var(--teal)':r<bbSet.min?'var(--red)':'var(--amber)';

const bbDays=v=>typeof v==='number'?(Number.isInteger(v)&&v>=0&&v<=6?[v]:[]):(typeof v==='string'&&v?[...new Set(v.split(/[|,]/).map(Number).filter(n=>Number.isInteger(n)&&n>=0&&n<=6))].sort((a,b)=>a-b):[]);
const bbDayStore=a=>{a=[...new Set(a)].sort((x,y)=>x-y);return a.length===0?'':a.length===1?a[0]:a.join('|')};
const bbWK=i=>{const n=new Date(),t=(n.getDay()+6)%7;n.setDate(n.getDate()-t+i);return bbDK(n)};
function bbRunsOf(id){const m=Object.assign({},bbRuns[id]||{});bbSes.forEach(s=>{if(s.doc===id)m[s.term]=(m[s.term]||0)+1});return m}

function bbEff(){  // 통계 = 기존(통합) 기록 + 확정된 풀이(세션)들
  if(bbEC)return bbEC;const E={};
  const get=(id,k)=>{const d=E[id]=E[id]||{};return d[k]=d[k]||{T:{}}};
  for(const id in bbRec)for(const k in bbRec[id])for(const t in (bbRec[id][k].T||{})){const x=bbRec[id][k].T[t];if(x.a)get(id,k).T[t]={a:x.a,c:x.c,l:x.l,ts:x.ts||0}}
  bbSes.slice().sort((p,q)=>p.ts-q.ts).forEach(s=>{for(const k in (s.j||{})){const o=get(s.doc,k).T,x=o[s.term]=o[s.term]||{a:0,c:0,l:'',ts:0};x.a++;if(s.j[k]==='O')x.c++;x.l=s.j[k];x.ts=s.ts}});
  return bbEC=E;
}

const BB_OK=new Set(['P','DIV','B','STRONG','I','EM','U','BR','TABLE','TBODY','THEAD','TR','H2','H3','H4','UL','OL','LI','SUB','SUP']);
const BB_SKIP=new Set(['SCRIPT','STYLE','INS','IFRAME','FIGURE','IMG','BUTTON','INPUT','TEXTAREA','SVG','NOSCRIPT']);
function bbClean(src,out){
  src.childNodes.forEach(n=>{
    if(n.nodeType===3){out.appendChild(document.createTextNode(n.nodeValue));return}
    if(n.nodeType!==1||BB_SKIP.has(n.tagName))return;
    const t=n.tagName;let el=null;
    if(t==='SPAN'&&n.classList.contains('blank')){el=document.createElement('span');el.className='blank';el.textContent=n.textContent.trim();out.appendChild(el);return}
    if(t==='TD'||t==='TH'){el=document.createElement('td');
      ['colspan','rowspan'].forEach(a=>{const v=parseInt(n.getAttribute(a));if(v>1&&v<20)el.setAttribute(a,v)});
      if(/background/.test(n.getAttribute('style')||'')&&!n.querySelector('.blank'))el.className='bb-th';
    }else if(BB_OK.has(t)){el=document.createElement(t.toLowerCase());if(t==='DIV'&&n.classList.contains('contentbox'))el.className='contentbox'}
    if(el){bbClean(n,el);out.appendChild(el)}else bbClean(n,out);
  });
}
function bbParse(raw){
  raw=raw.trim();let m={title:'',src:'',html:raw};
  if(raw.startsWith('IMGO_BBOGAE::')){try{m=JSON.parse(raw.slice(13))}catch(e){return null}}
  const d=new DOMParser().parseFromString('<body>'+m.html+'</body>','text/html'),box=document.createElement('div');bbClean(d.body,box);
  box.querySelectorAll('p,div:not(.contentbox)').forEach(e=>{if(!e.textContent.replace(/\u00a0/g,'').trim()&&!e.querySelector('table,br'))e.remove()});
  const n=box.querySelectorAll('.blank').length;
  return n?{title:m.title||'',src:m.src||'',html:box.innerHTML,n}:null;
}
function bbBox(doc){const b=document.createElement('div');b.innerHTML=doc.html;let i=0;b.querySelectorAll('.blank').forEach(e=>{e.className='bb-b';e.dataset.k=(i++)+'_'+bbHash(e.textContent)});return b}
function bbAgg(id,t,keys){
  const r=bbEff()[id]||{};let a=0,c=0,w=0,l=0;
  for(const k in r){if(keys&&!keys.has(k))continue;const T=r[k].T||{};
    if(t==='all'){for(const n in T){a+=T[n].a;c+=T[n].c}}else if(T[t]){a+=T[t].a;c+=T[t].c}
    const u=T[bbSet.term];if(u&&u.a)l++;if(bbWk(u))w++}
  return{a,c,w,l,rate:a?Math.round(c*100/a):null};
}

function bbDn(key,id){const m=(bbDone[key]=bbDone[key]||{});if(m[id])delete m[id];else m[id]=1;bbEnq('done',`done|${key}|${id}`,{date:key,docId:id,done:m[id]?1:0});bbSave();bbRender()}
function bbList(){

function bbCvParse(v){
  const B=[];

    const d=new DOMParser().parseFromString(bbCv.html,'text/html');
    [...d.querySelectorAll('table')].filter(t=>!t.parentElement.closest('table')).forEach(t=>{
      B.push({k:'table',rows:[...t.rows].map(r=>[...r.cells].map(c=>{
        const k=c.cloneNode(true);k.querySelectorAll('br').forEach(b=>b.replaceWith('\n'));k.querySelectorAll('p,div,li').forEach(p=>p.append('\n'));
        const tx=k.textContent.replace(/[ \t\u00a0\r]+/g,' ').split('\n').map(x=>x.trim()).filter(Boolean).join('\n');
        return{t:tx,cs:c.colSpan||1,rs:c.rowSpan||1,off:0};
      }))});
    });
    if(B.length)return B;
  }
  let tb=null;   // 일반 텍스트: 탭 또는 | 로 칸 구분, # 제목
  for(const raw of v.split(/\r?\n/)){
    const l=raw.replace(/\s+$/,''),isT=l.includes('\t'),isP=/^\s*\|/.test(l);
    if(isT||isP){
      const cs=isT?l.split('\t'):l.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|');
      if(isP&&cs.every(c=>/^\s*:?-{2,}:?\s*$/.test(c)))continue;
      if(!tb){tb={k:'table',rows:[]};B.push(tb)}
      tb.rows.push(cs.map(c=>({t:c.trim(),cs:1,rs:1,off:0})));continue;

async function bbPush(who){

          else{const d=bbDocs.find(x=>x.id===it.id);if(d){if(nd>=3)continue;nd++;const p={id:d.id,ts:it.ts,title:d.title,subj:d.subj||'',loc:d.loc||'',day:d.day===undefined?'':d.day,src:d.src||'',n:d.n||0};if(it.h)p.html=d.html;b.docs.push(p)}}

    }

async function bbPull(who,full){

  (r.docs||[]).forEach(sd=>{

    if(sd.deleted){if(l){bbDocs.splice(i,1);delete bbRec[sd.id];delete bbRuns[sd.id];if(bbView===sd.id)bbView=null;ch=true}return}
    if(l&&sd.ts<=(l.ts||0))return;

    const dd=(bbRec[x.docId]=bbRec[x.docId]||{}),bb=(dd[x.blankKey]=dd[x.blankKey]||{T:{}});

  });

  });
  (r.ses||[]).forEach(x=>{
    if(pd('ses|'+x.sid))return;
    const i=bbSes.findIndex(v=>v.id===x.sid);
    if(x.deleted){if(i>=0){bbSes.splice(i,1);ch=true}return}
    if(i<0){bbSes.push({id:x.sid,doc:x.docId,term:x.term,ts:x.at,j:x.j||{}});ch=true}

const bbFullDone={};let bbSyT='';
async function bbSync(){

    if(full&&Object.keys(bbQRead(who)).length)throw new Error('pending');   // 못 보낸 게 있으면 서버 내용으로 덮기 전에 중단
    await bbPull(who,full);bbFullDone[who]=true;
    const d=new Date();bbSyT=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');

  }catch(e){bbSyErr=true}
  finally{bbSyncing=false;bbSyUI();if(!bbSyErr&&!bbView&&document.getElementById('bbRoot'))bbRender()}
}
function bbManual(){bbFullDone[bbPerson]=false;bbSync()}
document.addEventListener('visibilitychange',()=>{const e=document.getElementById('bbRoot');if(!document.hidden&&e&&e.offsetParent)bbSync()});
window.addEventListener('online',()=>bbPush());


// ==================== THEME ====================
function toggleTheme(){
  const isLight = document.body.classList.toggle('light');
  document.getElementById('themeToggleBtn').textContent = isLight ? '🌞' : '🌙';
  localStorage.setItem('imgo_theme', isLight ? 'light' : 'dark');
  if(typeof examPerson !== 'undefined' && examPerson){
    buildExamControls();
    renderExamTrend();
    renderExamSubjectTabs();
    renderAvgRateChart();
  }
}
(function initTheme(){
  if(localStorage.getItem('imgo_theme')==='light'){
    document.body.classList.add('light');
    const btn = document.getElementById('themeToggleBtn');
    if(btn) btn.textContent = '🌞';
  }
})();

(async()=>{
  await loadData();
  updateDday();
  buildTermTabs();
  showTerm(detectCurrentTerm());
  renderNoticeView();
  buildSubjectTabs();
  renderExams();
})();

    navigator.serviceWorker.register('sw.js')
      .then(r=>console.log('[SW] registered:', r.scope))
      .catch(e=>console.warn('[SW] registration failed:', e));
  });
}
